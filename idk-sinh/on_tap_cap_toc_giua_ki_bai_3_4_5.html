    // Raw markdown
    const mdContent = "# \ud83e\uddec C\u1ea8M NANG \u00d4N T\u1eacP C\u1ea4P T\u1ed0C GI\u1eeeA K\u00cc I - SINH H\u1eccC 10\n## PH\u1ea6N 1: SINH H\u1eccC T\u1ebe B\u00c0O (B\u00c0I 3, B\u00c0I 4, B\u00c0I 5)\n*(B\u1ed9 s\u00e1ch K\u1ebft n\u1ed1i tri th\u1ee9c v\u1edbi cu\u1ed9c s\u1ed1ng - GDPT 2018)*\n\n---\n\n## \ud83d\udccc PH\u1ea6N 1: T\u1ed4NG H\u1ee2P KI\u1ebeN TH\u1ee8C C\u1ed0T L\u00d5I (\u0102N CH\u1eaeC \u0110I\u1ec2M TH\u00d4NG HI\u1ec2U & NH\u1eacN BI\u1ebeT)\n\n### \ud83c\udf3f CHUY\u00caN \u0110\u1ec0 1: C\u00c1C C\u1ea4P \u0110\u1ed8 T\u1ed4 CH\u1ee8C C\u1ee6A TH\u1ebe GI\u1edaI S\u1ed0NG (B\u00c0I 3)\n\n#### 1. Kh\u00e1i ni\u1ec7m c\u1ea5p \u0111\u1ed9 t\u1ed5 ch\u1ee9c s\u1ed1ng\n- **C\u1ea5p \u0111\u1ed9 t\u1ed5 ch\u1ee9c s\u1ed1ng:** L\u00e0 v\u1ecb tr\u00ed c\u1ee7a m\u1ed9t t\u1ed5 ch\u1ee9c s\u1ed1ng trong th\u1ebf gi\u1edbi s\u1ed1ng, t\u1eeb ph\u00e2n t\u1eed $\\rightarrow$ b\u00e0o quan $\\rightarrow$ t\u1ebf b\u00e0o $\\rightarrow$ m\u00f4 $\\rightarrow$ c\u01a1 quan $\\rightarrow$ h\u1ec7 c\u01a1 quan $\\rightarrow$ c\u01a1 th\u1ec3 $\\rightarrow$ qu\u1ea7n th\u1ec3 $\\rightarrow$ qu\u1ea7n x\u00e3 $\\rightarrow$ h\u1ec7 sinh th\u00e1i $\\rightarrow$ sinh quy\u1ec3n.\n- **C\u00e1c c\u1ea5p \u0111\u1ed9 t\u1ed5 ch\u1ee9c s\u1ed1ng c\u01a1 b\u1ea3n:** L\u00e0 nh\u1eefng c\u1ea5p \u0111\u1ed9 c\u00f3 c\u1ea5u tr\u00fac \u1ed5n \u0111\u1ecbnh, c\u00f3 th\u1ec3 th\u1ef1c hi\u1ec7n \u0111\u01b0\u1ee3c c\u00e1c ch\u1ee9c n\u0103ng s\u1ed1ng c\u01a1 b\u1ea3n (trao \u0111\u1ed5i ch\u1ea5t, sinh tr\u01b0\u1edfng, sinh s\u1ea3n, c\u1ea3m \u1ee9ng).\n  $$\\textbf{T\u1ebf b\u00e0o} \\longrightarrow \\textbf{C\u01a1 th\u1ec3} \\longrightarrow \\textbf{Qu\u1ea7n th\u1ec3} \\longrightarrow \\textbf{Qu\u1ea7n x\u00e3 - H\u1ec7 sinh th\u00e1i}$$\n  *(L\u01b0u \u00fd: B\u00e0o quan, ph\u00e2n t\u1eed, m\u00f4, c\u01a1 quan KH\u00d4NG ph\u1ea3i l\u00e0 c\u1ea5p \u0111\u1ed9 t\u1ed5 ch\u1ee9c s\u1ed1ng c\u01a1 b\u1ea3n).*\n\n#### 2. Ba \u0111\u1eb7c \u0111i\u1ec3m chung c\u1ed1t l\u00f5i c\u1ee7a c\u00e1c c\u1ea5p t\u1ed5 ch\u1ee9c s\u1ed1ng\n1. **Nguy\u00ean t\u1eafc th\u1ee9 b\u1eadc:**\n   - T\u1ed5 ch\u1ee9c c\u1ea5p d\u01b0\u1edbi l\u00e0m n\u1ec1n t\u1ea3ng \u0111\u1ec3 x\u00e2y d\u1ef1ng n\u00ean t\u1ed5 ch\u1ee9c c\u1ea5p tr\u00ean.\n   - **\u0110\u1eb7c t\u00ednh n\u1ed5i tr\u1ed9i (Emergent property):** L\u00e0 \u0111\u1eb7c t\u00ednh m\u00e0 c\u1ea5p t\u1ed5 ch\u1ee9c c\u1ea5p tr\u00ean c\u00f3 \u0111\u01b0\u1ee3c nh\u01b0ng c\u1ea5p t\u1ed5 ch\u1ee9c c\u1ea5p d\u01b0\u1edbi kh\u00f4ng c\u00f3. \u0110\u1eb7c t\u00ednh n\u1ed5i tr\u1ed9i \u0111\u01b0\u1ee3c h\u00ecnh th\u00e0nh do s\u1ef1 t\u01b0\u01a1ng t\u00e1c gi\u1eefa c\u00e1c b\u1ed9 ph\u1eadn c\u1ea5u th\u00e0nh.\n2. **H\u1ec7 th\u1ed1ng m\u1edf v\u00e0 t\u1ef1 \u0111i\u1ec1u ch\u1ec9nh:**\n   - **H\u1ec7 th\u1ed1ng m\u1edf:** Sinh v\u1eadt th\u01b0\u1eddng xuy\u00ean trao \u0111\u1ed5i ch\u1ea5t v\u00e0 n\u0103ng l\u01b0\u1ee3ng v\u1edbi m\u00f4i tr\u01b0\u1eddng b\u00ean ngo\u00e0i; ti\u1ebfp nh\u1eadn v\u1eadt ch\u1ea5t/n\u0103ng l\u01b0\u1ee3ng v\u00e0 th\u1ea3i ch\u1ea5t th\u1ea3i ra m\u00f4i tr\u01b0\u1eddng.\n   - **C\u01a1 ch\u1ebf t\u1ef1 \u0111i\u1ec1u ch\u1ec9nh:** Kh\u1ea3 n\u0103ng t\u1ef1 duy tr\u00ec v\u00e0 \u0111i\u1ec1u h\u00f2a s\u1ef1 c\u00e2n b\u1eb1ng n\u1ed9i m\u00f4i (homeostasis) gi\u00fap sinh v\u1eadt t\u1ed3n t\u1ea1i v\u00e0 th\u00edch nghi (v\u00ed d\u1ee5: \u0111i\u1ec1u h\u00f2a th\u00e2n nhi\u1ec7t, \u0111i\u1ec1u h\u00f2a l\u01b0\u1ee3ng \u0111\u01b0\u1eddng trong m\u00e1u nh\u1edd insulin v\u00e0 glucagon).\n3. **Th\u1ebf gi\u1edbi s\u1ed1ng li\u00ean t\u1ee5c ti\u1ebfn h\u00f3a:**\n   - Nh\u1edd qu\u00e1 tr\u00ecnh nh\u00e2n \u0111\u00f4i DNA c\u00f3 th\u1ec3 ph\u00e1t sinh \u0111\u1ed9t bi\u1ebfn v\u00e0 ch\u1ecdn l\u1ecdc t\u1ef1 nhi\u00ean s\u00e0ng l\u1ecdc, t\u1ea1o n\u00ean s\u1ef1 \u0111a d\u1ea1ng sinh h\u1ecdc v\u00f4 c\u00f9ng phong ph\u00fa ng\u00e0y nay nh\u01b0ng \u0111\u1ec1u c\u00f3 chung m\u1ed9t ngu\u1ed3n g\u1ed1c.\n\n---\n\n### \ud83d\udca7 CHUY\u00caN \u0110\u1ec0 2: C\u00c1C NGUY\u00caN T\u1ed0 H\u00d3A H\u1eccC V\u00c0 N\u01af\u1edaC (B\u00c0I 4)\n\n#### 1. C\u00e1c nguy\u00ean t\u1ed1 h\u00f3a h\u1ecdc c\u1ea5u t\u1ea1o n\u00ean t\u1ebf b\u00e0o\n- Trong t\u1ef1 nhi\u00ean c\u00f3 kho\u1ea3ng 25 nguy\u00ean t\u1ed1 c\u1ea5u t\u1ea1o n\u00ean c\u01a1 th\u1ec3 s\u1ed1ng.\n- B\u1ed1n nguy\u00ean t\u1ed1 ch\u00ednh: **C, H, O, N** chi\u1ebfm kho\u1ea3ng **$96\\%$** kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 th\u1ec3 s\u1ed1ng.\n- **Nguy\u00ean t\u1ed1 Carbon ($C$):** C\u00f3 4 electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng, c\u00f3 th\u1ec3 t\u1ea1o 4 li\u00ean k\u1ebft c\u1ed9ng h\u00f3a tr\u1ecb v\u1edbi c\u00e1c nguy\u00ean t\u1eed kh\u00e1c, t\u1ea1o n\u00ean \"b\u1ed9 khung carbon\" \u0111a d\u1ea1ng (m\u1ea1ch th\u1eb3ng, nh\u00e1nh, v\u00f2ng) l\u00e0m n\u1ec1n t\u1ea3ng cho m\u1ecdi \u0111\u1ea1i ph\u00e2n t\u1eed sinh h\u1ecdc.\n\n#### 2. Ph\u00e2n lo\u1ea1i nguy\u00ean t\u1ed1: \u0110a l\u01b0\u1ee3ng vs Vi l\u01b0\u1ee3ng\n\n| Ti\u00eau ch\u00ed | Nguy\u00ean t\u1ed1 \u0110a l\u01b0\u1ee3ng (Macroelements) | Nguy\u00ean t\u1ed1 Vi l\u01b0\u1ee3ng (Microelements) |\n| :--- | :--- | :--- |\n| **H\u00e0m l\u01b0\u1ee3ng** | $\\ge 0,01\\%$ kh\u1ed1i l\u01b0\u1ee3ng ch\u1ea5t kh\u00f4 | $< 0,01\\%$ kh\u1ed1i l\u01b0\u1ee3ng ch\u1ea5t kh\u00f4 |\n| **C\u00e1c nguy\u00ean t\u1ed1 ti\u00eau bi\u1ec3u** | C, H, O, N, P, S, Ca, K, Na, Mg... | Fe, Zn, Cu, I, Mo, Mn, F... |\n| **Vai tr\u00f2 ch\u00ednh** | **X\u00e2y d\u1ef1ng c\u1ea5u tr\u00fac t\u1ebf b\u00e0o, m\u00f4, c\u01a1 quan**; tham gia c\u1ea5u t\u1ea1o c\u00e1c \u0111\u1ea1i ph\u00e2n t\u1eed (protein, lipid, glucid, nucleic acid). | **Ho\u1ea1t h\u00f3a enzyme, c\u1ea5u t\u1ea1o vitamin v\u00e0 hormone**; \u0111i\u1ec1u ti\u1ebft c\u00e1c ph\u1ea3n \u1ee9ng sinh h\u00f3a. |\n| **H\u1eadu qu\u1ea3 khi thi\u1ebfu** | C\u01a1 th\u1ec3 sinh tr\u01b0\u1edfng k\u00e9m, r\u1ed1i lo\u1ea1n c\u1ea5u tr\u00fac. | G\u00e2y b\u1ec7nh l\u00fd nghi\u00eam tr\u1ecdng: Thi\u1ebfu **Iodine ($I$)** $\\rightarrow$ b\u01b0\u1edbu c\u1ed5, ch\u1eadm ph\u00e1t tri\u1ec3n; Thi\u1ebfu **Iron ($Fe$)** $\\rightarrow$ thi\u1ebfu m\u00e1u (do Fe l\u00e0 nh\u00e2n c\u1ee7a Hemoglobin). |\n\n#### 3. C\u1ea5u tr\u00fac v\u00e0 vai tr\u00f2 sinh h\u1ecdc \u0111\u1eb7c bi\u1ec7t c\u1ee7a n\u01b0\u1edbc\n- **C\u1ea5u tr\u00fac ph\u00e2n t\u1eed:**\n  - G\u1ed3m 1 nguy\u00ean t\u1eed Oxygen li\u00ean k\u1ebft c\u1ed9ng h\u00f3a tr\u1ecb v\u1edbi 2 nguy\u00ean t\u1eed Hydrogen.\n  - Do Oxygen c\u00f3 \u0111\u1ed9 \u00e2m \u0111i\u1ec7n l\u1edbn h\u01a1n Hydrogen, \u0111\u00f4i electron d\u00f9ng chung b\u1ecb k\u00e9o l\u1ec7ch v\u1ec1 ph\u00eda Oxygen $\\rightarrow$ \u0110\u1ea7u O mang \u0111i\u1ec7n t\u00edch \u00e2m nh\u1eb9 ($\\delta^-$), hai \u0111\u1ea7u H mang \u0111i\u1ec7n t\u00edch d\u01b0\u01a1ng nh\u1eb9 ($\\delta^+$).\n  - Ph\u00e2n t\u1eed n\u01b0\u1edbc c\u00f3 **t\u00ednh ph\u00e2n c\u1ef1c**.\n- **Li\u00ean k\u1ebft Hydrogen:** C\u00e1c ph\u00e2n t\u1eed n\u01b0\u1edbc h\u00fat nhau v\u00e0 h\u00fat c\u00e1c ph\u00e2n t\u1eed ph\u00e2n c\u1ef1c kh\u00e1c b\u1eb1ng **li\u00ean k\u1ebft hydrogen** y\u1ebfu, t\u1ea1o n\u00ean \"m\u1ea1ng l\u01b0\u1edbi n\u01b0\u1edbc\" b\u1ec1n v\u1eefng.\n- **Vai tr\u00f2 sinh h\u1ecdc c\u1ee7a n\u01b0\u1edbc:**\n  1. L\u00e0 **th\u00e0nh ph\u1ea7n ch\u1ee7 y\u1ebfu** c\u1ea5u t\u1ea1o n\u00ean t\u1ebf b\u00e0o v\u00e0 c\u01a1 th\u1ec3 (chi\u1ebfm 70 - 90% kh\u1ed1i l\u01b0\u1ee3ng).\n  2. L\u00e0 **dung m\u00f4i h\u00f2a tan** tuy\u1ec7t v\u1eddi cho nhi\u1ec1u ch\u1ea5t ph\u00e2n c\u1ef1c v\u00e0 ion.\n  3. L\u00e0 **m\u00f4i tr\u01b0\u1eddng v\u00e0 ch\u1ea5t tham gia** c\u00e1c ph\u1ea3n \u1ee9ng sinh h\u00f3a (ph\u1ea3n \u1ee9ng th\u1ee7y ph\u00e2n...).\n  4. Gi\u00fap **\u0111i\u1ec1u h\u00f2a nhi\u1ec7t \u0111\u1ed9** cho t\u1ebf b\u00e0o v\u00e0 c\u01a1 th\u1ec3 (nh\u1edd nhi\u1ec7t dung ri\u00eang cao v\u00e0 nhi\u1ec7t bay h\u01a1i l\u1edbn).\n  5. M\u00f4i tr\u01b0\u1eddng v\u1eadn chuy\u1ec3n c\u00e1c ch\u1ea5t dinh d\u01b0\u1ee1ng v\u00e0 ch\u1ea5t th\u1ea3i trong c\u01a1 th\u1ec3.\n\n---\n\n### \ud83e\uddec CHUY\u00caN \u0110\u1ec0 3: C\u00c1C PH\u00c2N T\u1eec SINH H\u1eccC TRONG T\u1ebe B\u00c0O (B\u00c0I 5)\n\n#### B\u1ea2NG SO S\u00c1NH 4 \u0110\u1ea0I PH\u00c2N T\u1eec SINH H\u1eccC (CARBOHYDRATE - LIPID - PROTEIN - NUCLEIC ACID)\n\n| \u0110\u1eb7c \u0111i\u1ec3m | CARBOHYDRATE (\u0110\u01b0\u1eddng) | LIPID (Ch\u1ea5t b\u00e9o) | PROTEIN (Ch\u1ea5t \u0111\u1ea1m) | NUCLEIC ACID (DNA / RNA) |\n| :--- | :--- | :--- | :--- | :--- |\n| **Nguy\u00ean t\u1ed1 c\u1ea5u t\u1ea1o** | C, H, O (t\u1ec9 l\u1ec7 $1:2:1$) | C, H, O (\u00edt O, nhi\u1ec1u C v\u00e0 H), c\u00f3 th\u1ec3 c\u00f3 P | C, H, O, N (th\u01b0\u1eddng c\u00f3 th\u00eam S) | C, H, O, N, P |\n| **Nguy\u00ean t\u1eafc c\u1ea5u t\u1ea1o** | **\u0110a ph\u00e2n** (Polymer) | **KH\u00d4NG theo nguy\u00ean t\u1eafc \u0111a ph\u00e2n** | **\u0110a ph\u00e2n** (Polymer) | **\u0110a ph\u00e2n** (Polymer) |\n| **\u0110\u01a1n ph\u00e2n (Monomer)** | \u0110\u01b0\u1eddng \u0111\u01a1n (Monosaccharide: Glucose, Fructose, Galactose) | Kh\u00f4ng c\u00f3 \u0111\u01a1n ph\u00e2n (g\u1ed3m Glycerol + Acid b\u00e9o) | **Amino acid** (20 lo\u1ea1i amino acid kh\u00e1c nhau) | **Nucleotide** (g\u1ed3m 3 th\u00e0nh ph\u1ea7n: g\u1ed1c phosphate, \u0111\u01b0\u1eddng 5C, base nit\u01a1) |\n| **Li\u00ean k\u1ebft h\u00f3a h\u1ecdc** | Li\u00ean k\u1ebft Glycosidic | Li\u00ean k\u1ebft Ester | **Li\u00ean k\u1ebft Peptide** (gi\u1eefa nh\u00f3m $-COOH$ v\u00e0 $-NH_2$) | **Li\u00ean k\u1ebft Phosphodiester** & **Li\u00ean k\u1ebft Hydrogen** |\n| **Ph\u00e2n lo\u1ea1i** | - **\u0110\u01b0\u1eddng \u0111\u01a1n:** Glucose, Fructose, Ribose, Deoxyribose.<br>- **\u0110\u01b0\u1eddng \u0111\u00f4i:** Sucrose, Maltose, Lactose.<br>- **\u0110\u01b0\u1eddng \u0111a:** Tinh b\u1ed9t, Glycogen, Cellulose, Chitin. | - **Lipid \u0111\u01a1n gi\u1ea3n:** M\u1ee1 (acid b\u00e9o no), D\u1ea7u (acid b\u00e9o kh\u00f4ng no), S\u00e1p.<br>- **Lipid ph\u1ee9c t\u1ea1p:** Phospholipid, Steroid (Cholesterol, hormone sinh d\u1ee5c), Carotenoid. | - C\u1ea5u tr\u00fac 4 b\u1eadc:<br>+ **B\u1eadc 1:** Chu\u1ed7i polypeptide th\u1eb3ng.<br>+ **B\u1eadc 2:** Xo\u1eafn $\\alpha$ ho\u1eb7c g\u1ea5p n\u1ebfp $\\beta$.<br>+ **B\u1eadc 3:** Cu\u1ed9n xo\u1eafn kh\u00f4ng gian 3D.<br>+ **B\u1eadc 4:** G\u1ed3m $\\ge 2$ chu\u1ed7i polypeptide li\u00ean k\u1ebft v\u1edbi nhau (v\u00ed d\u1ee5: Hemoglobin). | - **DNA:** Chu\u1ed7i xo\u1eafn k\u00e9p, \u0111\u01b0\u1eddng Deoxyribose, base A, T, G, C.<br>- **RNA:** Chu\u1ed7i \u0111\u01a1n, \u0111\u01b0\u1eddng Ribose, base A, U, G, C (g\u1ed3m mRNA, tRNA, rRNA). |\n| **Ch\u1ee9c n\u0103ng ch\u00ednh** | - Ngu\u1ed3n cung c\u1ea5p **n\u0103ng l\u01b0\u1ee3ng ch\u00ednh** (Glucose, Tinh b\u1ed9t, Glycogen).<br>- C\u1ea5u tr\u00fac th\u00e0nh t\u1ebf b\u00e0o th\u1ef1c v\u1eadt (Cellulose), v\u1ecf n\u1ea5m/c\u00f4n tr\u00f9ng (Chitin). | - **D\u1ef1 tr\u1eef n\u0103ng l\u01b0\u1ee3ng** l\u00e2u d\u00e0i (g\u1ea5p \u0111\u00f4i glucid c\u00f9ng kh\u1ed1i l\u01b0\u1ee3ng).<br>- C\u1ea5u t\u1ea1o m\u00e0ng sinh ch\u1ea5t (**Phospholipid** & **Cholesterol**).<br>- Dung m\u00f4i h\u00f2a tan vitamin A, D, E, K; \u0111\u1ec7m c\u01a1 h\u1ecdc, c\u00e1ch nhi\u1ec7t. | - C\u1ea5u tr\u00fac t\u1ebf b\u00e0o v\u00e0 m\u00f4 (Collagen, Keratin).<br>- **X\u00fac t\u00e1c sinh h\u1ecdc (Enzyme)**.<br>- V\u1eadn chuy\u1ec3n (Hemoglobin).<br>- B\u1ea3o v\u1ec7 mi\u1ec5n d\u1ecbch (Kh\u00e1ng th\u1ec3).<br>- \u0110i\u1ec1u h\u00f2a trao \u0111\u1ed5i ch\u1ea5t (Hormone Insulin).<br>- V\u1eadn \u0111\u1ed9ng (Actin, Myosin). | - **DNA:** L\u01b0u gi\u1eef, b\u1ea3o qu\u1ea3n v\u00e0 truy\u1ec1n \u0111\u1ea1t th\u00f4ng tin di truy\u1ec1n.<br>- **RNA:** Tr\u1ef1c ti\u1ebfp tham gia t\u1ed5ng h\u1ee3p protein (mRNA: truy\u1ec1n \u0111\u1ea1t TTDT; tRNA: v\u1eadn chuy\u1ec3n amino acid; rRNA: c\u1ea5u t\u1ea1o ribosome). |\n\n#### \u26a0\ufe0f C\u00c1C L\u01afU \u00dd B\u1eaaY \u0110\u1ec0 THI:\n- **Nguy\u00ean t\u1eafc b\u1ed5 sung trong DNA:** $A$ li\u00ean k\u1ebft v\u1edbi $T$ b\u1eb1ng **2 li\u00ean k\u1ebft hydrogen** ($A = T$); $G$ li\u00ean k\u1ebft v\u1edbi $C$ b\u1eb1ng **3 li\u00ean k\u1ebft hydrogen** ($G \\equiv C$).\n- **Hi\u1ec7n t\u01b0\u1ee3ng bi\u1ebfn t\u00ednh c\u1ee7a Protein:** Khi ch\u1ecbu nhi\u1ec7t \u0111\u1ed9 cao, pH b\u1ea5t th\u01b0\u1eddng, c\u00e1c li\u00ean k\u1ebft hydro v\u00e0 t\u01b0\u01a1ng t\u00e1c y\u1ebfu b\u1ecb ph\u00e1 v\u1ee1 $\\rightarrow$ protein m\u1ea5t c\u1ea5u tr\u00fac kh\u00f4ng gian 3 chi\u1ec1u $\\rightarrow$ **m\u1ea5t ho\u1ea1t t\u00ednh sinh h\u1ecdc**.\n- **T\u1ea1i sao cellulose b\u1ec1n v\u1eefng?** C\u00e1c chu\u1ed7i polymer glucose li\u00ean k\u1ebft song song v\u1edbi nhau b\u1eb1ng v\u00f4 s\u1ed1 li\u00ean k\u1ebft hydro t\u1ea1o th\u00e0nh c\u00e1c vi s\u1ee3i (microfibril) c\u1ef1c k\u1ef3 b\u1ec1n ch\u1eafc, c\u01a1 th\u1ec3 ng\u01b0\u1eddi kh\u00f4ng ti\u00eau h\u00f3a \u0111\u01b0\u1ee3c cellulose do thi\u1ebfu enzyme cellulase.\n\n---\n\n## \ud83c\udfaf PH\u1ea6N 2: PH\u00c2N D\u1ea0NG B\u00c0I T\u1eacP & C\u00d4NG TH\u1ee8C GI\u1ea2I NHANH\n\n### D\u1ea0NG 1: B\u00c0I TO\u00c1N X\u00c1C \u0110\u1ecaNH H\u00c0M L\u01af\u1ee2NG NGUY\u00caN T\u1ed0 & N\u01af\u1edaC\n- L\u01b0\u1ee3ng n\u01b0\u1edbc trong c\u01a1 th\u1ec3 ng\u01b0\u1eddi tr\u01b0\u1edfng th\u00e0nh chi\u1ebfm kho\u1ea3ng $65 - 70\\%$.\n- Thi\u1ebfu n\u01b0\u1edbc g\u00e2y r\u1ed1i lo\u1ea1n c\u00e2n b\u1eb1ng n\u1ed9i m\u00f4i, m\u00e1u \u0111\u1eb7c qu\u00e1nh, nguy c\u01a1 \u0111\u1ed9t qu\u1ef5.\n\n---\n\n### D\u1ea0NG 2: B\u00c0I TO\u00c1N V\u1ec0 NUCLEOTIDE V\u00c0 LI\u00caN K\u1ebeT TRONG PH\u00c2N T\u1eec DNA\n1. **S\u1ed1 l\u01b0\u1ee3ng v\u00e0 t\u1ec9 l\u1ec7 ph\u1ea7n tr\u0103m t\u1eebng lo\u1ea1i nucleotide trong DNA:**\n   Theo nguy\u00ean t\u1eafc b\u1ed5 sung:\n   $$A = T, \\quad G = C$$\n   $$\\text{T\u1ed5ng s\u1ed1 nucleotide } N = 2A + 2G = 2T + 2C$$\n   $$\\%A + \\%G = 50\\% \\quad (\\%A = \\%T, \\quad \\%G = \\%C)$$\n\n2. **Chi\u1ec1u d\u00e0i ph\u00e2n t\u1eed DNA ($L$):**\n   M\u1ed7i nucleotide d\u00e0i $3,4 \\text{ \\AA} = 0,34 \\text{ nm}$:\n   $$L = \\frac{N}{2} \\times 3,4 \\text{ \\AA} = \\frac{N}{2} \\times 0,34 \\text{ nm}$$\n\n3. **S\u1ed1 li\u00ean k\u1ebft Hydrogen ($H$):**\n   $$H = 2A + 3G = 2T + 3C$$\n\n4. **Kh\u1ed1i l\u01b0\u1ee3ng ph\u00e2n t\u1eed DNA ($M$):**\n   Kh\u1ed1i l\u01b0\u1ee3ng trung b\u00ecnh 1 nucleotide l\u00e0 $300 \\text{ \u0111vC}$:\n   $$M = N \\times 300 \\text{ \u0111vC}$$\n\n- **V\u00ed d\u1ee5 gi\u1ea3i nhanh:**\n  M\u1ed9t \u0111o\u1ea1n ph\u00e2n t\u1eed DNA c\u00f3 t\u1ed5ng s\u1ed1 $3000$ nucleotide, trong \u0111\u00f3 s\u1ed1 nucleotide lo\u1ea1i $A = 600$.\n  a) T\u00ednh s\u1ed1 nucleotide c\u00e1c lo\u1ea1i c\u00f2n l\u1ea1i.\n  b) T\u00ednh chi\u1ec1u d\u00e0i $L$ v\u00e0 s\u1ed1 li\u00ean k\u1ebft hydro c\u1ee7a \u0111o\u1ea1n DNA \u0111\u00f3.\n  *L\u1eddi gi\u1ea3i:*\n  + a) Theo NTBS: $T = A = 600 \\text{ nucl\u00ea\u00f4tit}$.\n    T\u1ed5ng $N = 2A + 2G = 3000 \\Longrightarrow G = \\frac{3000 - 2 \\times 600}{2} = 900 \\text{ nucl\u00ea\u00f4tit} = C$.\n  + b) Chi\u1ec1u d\u00e0i: $L = \\frac{N}{2} \\times 3,4 = \\frac{3000}{2} \\times 3,4 = 5100 \\text{ \\AA} = 510 \\text{ nm}$.\n  + S\u1ed1 li\u00ean k\u1ebft hydro: $H = 2A + 3G = 2 \\times 600 + 3 \\times 900 = 1200 + 2700 = 3900 \\text{ li\u00ean k\u1ebft}$.\n\n---\n\n## \ud83d\udcdd PH\u1ea6N 3: GI\u1ea2I CHI TI\u1ebeT T\u1eeaNG C\u00c2U H\u1eceI T\u1eea B\u1ed8 \u1ea2NH \u0110\u1ec0 THI\n\n#### C\u00e2u 1: \u0110\u1eb7c \u0111i\u1ec3m n\u00e0o sau \u0111\u00e2y KH\u00d4NG PH\u1ea2I l\u00e0 \u0111\u1eb7c \u0111i\u1ec3m chung c\u1ee7a th\u1ebf gi\u1edbi s\u1ed1ng?\nA. Li\u00ean t\u1ee5c ti\u1ebfn h\u00f3a.  \nB. T\u1ed5 ch\u1ee9c theo nguy\u00ean t\u1eafc th\u1ee9 b\u1eadc.  \nC. L\u00e0 m\u1ed9t h\u1ec7 th\u1ed1ng k\u00edn.  \nD. C\u00f3 kh\u1ea3 n\u0103ng t\u1ef1 \u0111i\u1ec1u ch\u1ec9nh.  \n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **C**.\n- **Gi\u1ea3i th\u00edch:** Th\u1ebf gi\u1edbi s\u1ed1ng l\u00e0 **h\u1ec7 th\u1ed1ng m\u1edf** (lu\u00f4n trao \u0111\u1ed5i ch\u1ea5t v\u00e0 n\u0103ng l\u01b0\u1ee3ng v\u1edbi m\u00f4i tr\u01b0\u1eddng), kh\u00f4ng th\u1ec3 l\u00e0 h\u1ec7 th\u1ed1ng k\u00edn.\n\n#### C\u00e2u 2: \u0110\u1eb7c t\u00ednh quan tr\u1ecdng nh\u1ea5t \u0111\u1ea3m b\u1ea3o t\u00ednh b\u1ec1n v\u1eefng v\u00e0 \u1ed5n \u0111\u1ecbnh c\u1ee7a t\u1ed5 ch\u1ee9c s\u1ed1ng l\u00e0 g\u00ec?\n- **\u0110\u00e1p \u00e1n:** **Kh\u1ea3 n\u0103ng t\u1ef1 \u0111i\u1ec1u ch\u1ec9nh** (gi\u00fap duy tr\u00ec c\u00e2n b\u1eb1ng n\u1ed9i m\u00f4i tr\u01b0\u1edbc c\u00e1c bi\u1ebfn \u0111\u1ed5i c\u1ee7a m\u00f4i tr\u01b0\u1eddng).\n\n#### C\u00e2u 3: \u0110\u1eb7c t\u00ednh n\u1ed5i tr\u1ed9i c\u1ee7a c\u00e1c c\u1ea5p t\u1ed5 ch\u1ee9c s\u1ed1ng l\u00e0 g\u00ec?\n- **\u0110\u00e1p \u00e1n:** L\u00e0 \u0111\u1eb7c t\u00ednh m\u00e0 **t\u1ed5 ch\u1ee9c c\u1ea5p tr\u00ean c\u00f3 \u0111\u01b0\u1ee3c nh\u01b0ng c\u00e1c c\u1ea5p t\u1ed5 ch\u1ee9c c\u1ea5p d\u01b0\u1edbi kh\u00f4ng c\u00f3**, h\u00ecnh th\u00e0nh do s\u1ef1 t\u01b0\u01a1ng t\u00e1c gi\u1eefa c\u00e1c b\u1ed9 ph\u1eadn c\u1ea5u th\u00e0nh.\n\n#### C\u00e2u 4: D\u00e3y c\u1ea5p \u0111\u1ed9 t\u1ed5 ch\u1ee9c s\u1ed1ng n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c s\u1eafp x\u1ebfp \u0111\u00fang theo th\u1ee9 t\u1ef1 t\u1eeb th\u1ea5p \u0111\u1ebfn cao?\n- **\u0110\u00e1p \u00e1n:** Ph\u00e2n t\u1eed $\\rightarrow$ B\u00e0o quan $\\rightarrow$ T\u1ebf b\u00e0o $\\rightarrow$ M\u00f4 $\\rightarrow$ C\u01a1 quan $\\rightarrow$ H\u1ec7 c\u01a1 quan $\\rightarrow$ C\u01a1 th\u1ec3 $\\rightarrow$ Qu\u1ea7n th\u1ec3 $\\rightarrow$ Qu\u1ea7n x\u00e3 $\\rightarrow$ H\u1ec7 sinh th\u00e1i $\\rightarrow$ Sinh quy\u1ec3n.\n\n#### C\u00e2u 5: Thi\u1ebfu m\u1ed9t l\u01b0\u1ee3ng nh\u1ecf nguy\u00ean t\u1ed1 Iodine ($I$), con ng\u01b0\u1eddi c\u00f3 nguy c\u01a1 m\u1eafc b\u1ec7nh g\u00ec?\n- **\u0110\u00e1p \u00e1n:** B\u1ec7nh **b\u01b0\u1edbu c\u1ed5** v\u00e0 ch\u1ee9ng thi\u1ec3u n\u0103ng tuy\u1ebfn gi\u00e1p (do Iodine l\u00e0 th\u00e0nh ph\u1ea7n thi\u1ebft y\u1ebfu c\u1ea5u t\u1ea1o n\u00ean hormone tiroxin c\u1ee7a tuy\u1ebfn gi\u00e1p).\n\n#### C\u00e2u 6: B\u1ed1n nguy\u00ean t\u1ed1 ch\u00ednh chi\u1ebfm kho\u1ea3ng 96% kh\u1ed1i l\u01b0\u1ee3ng c\u01a1 th\u1ec3 s\u1ed1ng l\u00e0 nh\u1eefng nguy\u00ean t\u1ed1 n\u00e0o?\n- **\u0110\u00e1p \u00e1n:** **C, H, O, N** (Carbon, Hydrogen, Oxygen, Nitrogen).\n\n#### C\u00e2u 7: T\u1ea1i sao c\u00e1c chuy\u00ean gia dinh d\u01b0\u1ee1ng lu\u00f4n khuy\u00ean n\u00ean \u0103n ph\u1ed1i h\u1ee3p nhi\u1ec1u lo\u1ea1i rau xanh v\u00e0 tr\u00e1i c\u00e2y kh\u00e1c nhau?\n- **\u0110\u00e1p \u00e1n:** V\u00ec m\u1ed7i lo\u1ea1i rau qu\u1ea3 cung c\u1ea5p c\u00e1c lo\u1ea1i vitamin, kho\u00e1ng ch\u1ea5t (nguy\u00ean t\u1ed1 vi l\u01b0\u1ee3ng) v\u00e0 ch\u1ea5t x\u01a1 (cellulose) kh\u00e1c nhau, gi\u00fap c\u01a1 th\u1ec3 nh\u1eadn \u0111\u1ea7y \u0111\u1ee7 c\u00e1c ch\u1ea5t vi l\u01b0\u1ee3ng x\u00fac t\u00e1c enzyme m\u00e0 c\u01a1 th\u1ec3 kh\u00f4ng th\u1ec3 t\u1ef1 t\u1ed5ng h\u1ee3p \u0111\u01b0\u1ee3c.\n\n#### C\u00e2u 8: T\u00ednh ph\u00e2n c\u1ef1c c\u1ee7a ph\u00e2n t\u1eed n\u01b0\u1edbc l\u00e0 do nguy\u00ean nh\u00e2n n\u00e0o?\n- **\u0110\u00e1p \u00e1n:** Do **\u0111\u1ed9 \u00e2m \u0111i\u1ec7n c\u1ee7a Oxygen l\u1edbn h\u01a1n Hydrogen**, l\u00e0m cho \u0111\u00f4i electron d\u00f9ng chung b\u1ecb k\u00e9o l\u1ec7ch v\u1ec1 ph\u00eda nguy\u00ean t\u1eed Oxygen, khi\u1ebfn \u0111\u1ea7u Oxygen t\u00edch \u0111i\u1ec7n \u00e2m nh\u1eb9 ($\\delta^-$), hai \u0111\u1ea7u Hydrogen t\u00edch \u0111i\u1ec7n d\u01b0\u01a1ng nh\u1eb9 ($\\delta^+$).\n\n#### C\u00e2u 9: Lo\u1ea1i carbohydrate n\u00e0o sau \u0111\u00e2y l\u00e0 th\u00e0nh ph\u1ea7n c\u1ea5u t\u1ea1o ch\u00ednh c\u1ee7a th\u00e0nh t\u1ebf b\u00e0o th\u1ef1c v\u1eadt?\nA. Tinh b\u1ed9t.  \nB. Glycogen.  \nC. Cellulose.  \nD. Glucose.  \n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **C. Cellulose** (c\u1ea5u t\u1ea1o t\u1eeb c\u00e1c chu\u1ed7i $\\beta$-glucose li\u00ean k\u1ebft v\u1edbi nhau b\u1eb1ng li\u00ean k\u1ebft $\\beta$-1,4-glycosidic t\u1ea1o th\u00e0nh vi s\u1ee3i c\u1ef1c b\u1ec1n ch\u1eafc).\n\n#### C\u00e2u 10: Ch\u1ea5t n\u00e0o sau \u0111\u00e2y l\u00e0 ngu\u1ed3n d\u1ef1 tr\u1eef n\u0103ng l\u01b0\u1ee3ng ng\u1eafn h\u1ea1n ch\u00ednh trong gan v\u00e0 c\u01a1 b\u1eafp c\u1ee7a \u0111\u1ed9ng v\u1eadt?\n- **\u0110\u00e1p \u00e1n:** **Glycogen** (\u0110\u01b0\u1eddng \u0111a ph\u00e2n nh\u00e1nh g\u1ed3m c\u00e1c \u0111\u01a1n ph\u00e2n $\\alpha$-glucose).\n\n#### C\u00e2u 11: Lipid c\u00f3 \u0111\u1eb7c t\u00ednh chung n\u00e0o sau \u0111\u00e2y?\n- **\u0110\u00e1p \u00e1n:** **K\u1ef5 n\u01b0\u1edbc (kh\u00f4ng tan trong n\u01b0\u1edbc)**, tan nhi\u1ec1u trong c\u00e1c dung m\u00f4i h\u1eefu c\u01a1 kh\u00f4ng ph\u00e2n c\u1ef1c (ete, benzen, c\u1ed3n...).\n\n#### C\u00e2u 12: M\u00e0ng sinh ch\u1ea5t c\u1ee7a t\u1ebf b\u00e0o \u0111\u01b0\u1ee3c c\u1ea5u t\u1ea1o ch\u1ee7 y\u1ebfu t\u1eeb lo\u1ea1i lipid n\u00e0o?\n- **\u0110\u00e1p \u00e1n:** **Phospholipid** (g\u1ed3m 1 \u0111\u1ea7u \u01b0a n\u01b0\u1edbc ch\u1ee9a nh\u00f3m phosphate v\u00e0 2 \u0111u\u00f4i acid b\u00e9o k\u1ef5 n\u01b0\u1edbc, x\u1ebfp th\u00e0nh l\u1edbp k\u00e9p) c\u00f9ng v\u1edbi **Cholesterol** (\u1edf t\u1ebf b\u00e0o \u0111\u1ed9ng v\u1eadt gi\u00fap \u1ed5n \u0111\u1ecbnh t\u00ednh l\u1ecfng c\u1ee7a m\u00e0ng).\n\n#### C\u00e2u 13: \u0110\u01a1n v\u1ecb c\u1ea5u t\u1ea1o n\u00ean protein l\u00e0 g\u00ec?\n- **\u0110\u00e1p \u00e1n:** **Amino acid** (g\u1ed3m nh\u00f3m amino $-NH_2$, nh\u00f3m carboxyl $-COOH$, nguy\u00ean t\u1eed H v\u00e0 g\u1ed1c bi\u1ebfn t\u00ednh $-R$). C\u00f3 kho\u1ea3ng 20 lo\u1ea1i amino acid c\u1ea5u t\u1ea1o n\u00ean protein sinh h\u1ecdc.\n\n#### C\u00e2u 14: Li\u00ean k\u1ebft h\u00f3a h\u1ecdc li\u00ean k\u1ebft c\u00e1c \u0111\u01a1n ph\u00e2n amino acid trong chu\u1ed7i polypeptide l\u00e0 li\u00ean k\u1ebft g\u00ec?\n- **\u0110\u00e1p \u00e1n:** **Li\u00ean k\u1ebft Peptide** (h\u00ecnh th\u00e0nh gi\u1eefa nh\u00f3m carboxyl $-COOH$ c\u1ee7a amino acid n\u00e0y v\u1edbi nh\u00f3m amino $-NH_2$ c\u1ee7a amino acid k\u1ebf ti\u1ebfp, \u0111\u1ed3ng th\u1eddi lo\u1ea1i \u0111i 1 ph\u00e2n t\u1eed n\u01b0\u1edbc).\n\n#### C\u00e2u 15: C\u1ea5u tr\u00fac b\u1eadc m\u1ea5y c\u1ee7a protein quy\u1ebft \u0111\u1ecbnh tr\u1ef1c ti\u1ebfp \u0111\u1ebfn c\u00e1c b\u1eadc c\u1ea5u tr\u00fac kh\u00f4ng gian c\u00f2n l\u1ea1i?\n- **\u0110\u00e1p \u00e1n:** **C\u1ea5u tr\u00fac b\u1eadc 1** (tr\u00ecnh t\u1ef1 s\u1eafp x\u1ebfp c\u00e1c amino acid trong chu\u1ed7i polypeptide x\u00e1c \u0111\u1ecbnh c\u00e1ch chu\u1ed7i cu\u1ed9n xo\u1eafn th\u00e0nh b\u1eadc 2, b\u1eadc 3 v\u00e0 b\u1eadc 4).\n\n#### C\u00e2u 16: Ph\u00e2n t\u1eed Protein Hemoglobin trong h\u1ed3ng c\u1ea7u c\u00f3 c\u1ea5u tr\u00fac b\u1eadc m\u1ea5y?\n- **\u0110\u00e1p \u00e1n:** **C\u1ea5u tr\u00fac b\u1eadc 4** (g\u1ed3m 4 chu\u1ed7i polypeptide: 2 chu\u1ed7i $\\alpha$ v\u00e0 2 chu\u1ed7i $\\beta$ k\u1ebft h\u1ee3p v\u1edbi 4 nh\u00e2n Heme ch\u1ee9a ion $Fe^{2+}$ \u0111\u1ec3 v\u1eadn chuy\u1ec3n kh\u00ed $O_2$ v\u00e0 $CO_2$).\n\n#### C\u00e2u 17: Ph\u00e2n t\u1eed DNA kh\u00e1c ph\u00e2n t\u1eed RNA \u1edf nh\u1eefng \u0111\u1eb7c \u0111i\u1ec3m c\u1ea5u tr\u00fac c\u01a1 b\u1ea3n n\u00e0o?\n- **\u0110\u00e1p \u00e1n:**\n  + DNA c\u00f3 **c\u1ea5u tr\u00fac chu\u1ed7i xo\u1eafn k\u00e9p**, \u0111\u01b0\u1eddng l\u00e0 **Deoxyribose ($C_5H_{10}O_4$)**, 4 lo\u1ea1i base: **A, T, G, C**.\n  + RNA c\u00f3 **c\u1ea5u tr\u00fac chu\u1ed7i \u0111\u01a1n**, \u0111\u01b0\u1eddng l\u00e0 **Ribose ($C_5H_{10}O_5$)**, 4 lo\u1ea1i base: **A, U, G, C** (thay $T$ b\u1eb1ng $U$).\n\n#### C\u00e2u 18: Trong ph\u00e2n t\u1eed DNA xo\u1eafn k\u00e9p, c\u00e1c nucleotide gi\u1eefa 2 m\u1ea1ch \u0111\u1ed1i di\u1ec7n li\u00ean k\u1ebft v\u1edbi nhau b\u1eb1ng lo\u1ea1i li\u00ean k\u1ebft n\u00e0o?\n- **\u0110\u00e1p \u00e1n:** **Li\u00ean k\u1ebft Hydrogen** theo nguy\u00ean t\u1eafc b\u1ed5 sung ($A$ n\u1ed1i v\u1edbi $T$ b\u1eb1ng 2 li\u00ean k\u1ebft H; $G$ n\u1ed1i v\u1edbi $C$ b\u1eb1ng 3 li\u00ean k\u1ebft H).\n\n#### C\u00e2u 19: Lo\u1ea1i RNA n\u00e0o \u0111\u00f3ng vai tr\u00f2 v\u1eadn chuy\u1ec3n amino acid t\u1edbi ribosome \u0111\u1ec3 d\u1ecbch m\u00e3 t\u1ed5ng h\u1ee3p protein?\n- **\u0110\u00e1p \u00e1n:** **tRNA (Transfer RNA - RNA v\u1eadn chuy\u1ec3n)**, c\u00f3 b\u1ed9 ba \u0111\u1ed1i m\u00e3 (anticodon) kh\u1edbp b\u1ed5 sung v\u1edbi codon tr\u00ean mRNA.\n\n#### C\u00e2u 20: Hi\u1ec7n t\u01b0\u1ee3ng l\u00f2ng tr\u1eafng tr\u1ee9ng b\u1ecb \u0111\u00f4ng c\u1ee9ng v\u00e0 \u0111\u1ed5i m\u00e0u tr\u1eafng \u0111\u1ee5c khi lu\u1ed9c ch\u00edn l\u00e0 minh ch\u1ee9ng cho hi\u1ec7n t\u01b0\u1ee3ng sinh h\u1ecdc n\u00e0o?\n- **\u0110\u00e1p \u00e1n:** **Hi\u1ec7n t\u01b0\u1ee3ng bi\u1ebfn t\u00ednh c\u1ee7a Protein** (Nhi\u1ec7t \u0111\u1ed9 cao l\u00e0m \u0111\u1ee9t g\u00e3y c\u00e1c li\u00ean k\u1ebft hydro v\u00e0 c\u1ea7u disulfite y\u1ebfu, l\u00e0m du\u1ed7i chu\u1ed7i v\u00e0 v\u00f3n c\u1ee5c protein Ovalbumin, m\u1ea5t c\u1ea5u tr\u00fac ban \u0111\u1ea7u).\n\n---\n\n## \u26a1 PH\u1ea6N 4: 10 C\u00c2U TEST NHANH TR\u01af\u1edaC KHI \u0110I NG\u1ee6 (K\u00c8M KEY)\n1. **C\u00e2u 1:** \u0110\u01a1n v\u1ecb c\u01a1 b\u1ea3n nh\u1ea5t c\u1ea5u t\u1ea1o n\u00ean m\u1ecdi c\u01a1 th\u1ec3 s\u1ed1ng l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** T\u1ebf b\u00e0o.\n2. **C\u00e2u 2:** Nguy\u00ean t\u1ed1 h\u00f3a h\u1ecdc n\u00e0o t\u1ea1o n\u00ean b\u1ed9 khung x\u01b0\u01a1ng s\u1ed1ng c\u1ee7a c\u00e1c \u0111\u1ea1i ph\u00e2n t\u1eed sinh h\u1ecdc? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Carbon ($C$).\n3. **C\u00e2u 3:** Li\u00ean k\u1ebft gi\u1eefa c\u00e1c ph\u00e2n t\u1eed n\u01b0\u1edbc v\u1edbi nhau \u0111\u01b0\u1ee3c g\u1ecdi l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Li\u00ean k\u1ebft Hydrogen.\n4. **C\u00e2u 4:** \u0110\u01a1n ph\u00e2n c\u1ee7a Carbohydrate l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Monosaccharide (\u0111\u01b0\u1eddng \u0111\u01a1n: Glucose, Fructose, Galactose).\n5. **C\u00e2u 5:** \u0110\u1ea1i ph\u00e2n t\u1eed sinh h\u1ecdc duy nh\u1ea5t kh\u00f4ng c\u1ea5u t\u1ea1o theo nguy\u00ean t\u1eafc \u0111a ph\u00e2n l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Lipid.\n6. **C\u00e2u 6:** B\u1eadc c\u1ea5u tr\u00fac kh\u00f4ng gian 3 chi\u1ec1u c\u1ee7a protein \u0111\u01b0\u1ee3c g\u1ecdi l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** C\u1ea5u tr\u00fac b\u1eadc 3.\n7. **C\u00e2u 7:** Ph\u00e2n t\u1eed DNA g\u1ed3m m\u1ea5y chu\u1ed7i polynucleotide? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** 2 chu\u1ed7i xo\u1eafn k\u00e9p, song song v\u00e0 ng\u01b0\u1ee3c chi\u1ec1u ($5' \\rightarrow 3'$ v\u00e0 $3' \\rightarrow 5'$).\n8. **C\u00e2u 8:** C\u1eb7p baz\u01a1 nit\u01a1 n\u00e0o li\u00ean k\u1ebft v\u1edbi nhau b\u1eb1ng 3 li\u00ean k\u1ebft hydro trong DNA? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** C\u1eb7p $G - C$.\n9. **C\u00e2u 9:** Ch\u1ee9c n\u0103ng ch\u00ednh c\u1ee7a enzyme l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** X\u00fac t\u00e1c sinh h\u1ecdc, l\u00e0m t\u0103ng t\u1ed1c \u0111\u1ed9 ph\u1ea3n \u1ee9ng m\u00e0 kh\u00f4ng b\u1ecb bi\u1ebfn \u0111\u1ed5i sau ph\u1ea3n \u1ee9ng.\n10. **C\u00e2u 10:** Khi b\u1ecb s\u1ed1t cao tr\u00ean $40^\\circ\\text{C}$, v\u00ec sao c\u01a1 th\u1ec3 g\u1eb7p nguy hi\u1ec3m t\u00ednh m\u1ea1ng? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** V\u00ec nhi\u1ec7t \u0111\u1ed9 cao l\u00e0m bi\u1ebfn t\u00ednh c\u00e1c protein v\u00e0 enzyme thi\u1ebft y\u1ebfu trong t\u1ebf b\u00e0o, ng\u01b0ng tr\u1ec7 c\u00e1c ph\u1ea3n \u1ee9ng chuy\u1ec3n h\u00f3a.\n";
