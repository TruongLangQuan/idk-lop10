    // Raw markdown
    const mdContent = "# \u2697\ufe0f C\u1ea8M NANG \u00d4N T\u1eacP C\u1ea4P T\u1ed0C GI\u1eeeA K\u00cc I - H\u00d3A H\u1eccC 10\n## CH\u01af\u01a0NG 2: B\u1ea2NG TU\u1ea6N HO\u00c0N C\u00c1C NGUY\u00caN T\u1ed0 H\u00d3A H\u1eccC & \u0110\u1ecaNH LU\u1eacT TU\u1ea6N HO\u00c0N\n*(B\u1ed9 s\u00e1ch K\u1ebft n\u1ed1i tri th\u1ee9c v\u1edbi cu\u1ed9c s\u1ed1ng - GDPT 2018)*\n\n---\n\n## \ud83d\udccc PH\u1ea6N 1: L\u00dd THUY\u1ebeT \u0102N \u0110I\u1ec2M TH\u1ea6N T\u1ed0C (H\u1eccC THU\u1ed8C TRONG 30 PH\u00daT)\n\n### 1. Nguy\u00ean t\u1eafc s\u1eafp x\u1ebfp trong B\u1ea3ng tu\u1ea7n ho\u00e0n (BTH)\n1. C\u00e1c nguy\u00ean t\u1ed1 \u0111\u01b0\u1ee3c s\u1eafp x\u1ebfp theo chi\u1ec1u **t\u0103ng d\u1ea7n c\u1ee7a \u0111i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n nguy\u00ean t\u1eed** ($Z$).\n2. C\u00e1c nguy\u00ean t\u1ed1 c\u00f3 c\u00f9ng **s\u1ed1 l\u1edbp electron** trong nguy\u00ean t\u1eed \u0111\u01b0\u1ee3c x\u1ebfp th\u00e0nh m\u1ed9t **h\u00e0ng (chu k\u1ef3)**.\n3. C\u00e1c nguy\u00ean t\u1ed1 c\u00f3 **c\u1ea5u h\u00ecnh electron t\u01b0\u01a1ng t\u1ef1 nhau** (\u0111\u1eb7c bi\u1ec7t l\u00e0 s\u1ed1 electron h\u00f3a tr\u1ecb) \u0111\u01b0\u1ee3c x\u1ebfp th\u00e0nh m\u1ed9t **c\u1ed9t (nh\u00f3m)**.\n\n---\n\n### 2. C\u1ea5u t\u1ea1o B\u1ea3ng tu\u1ea7n ho\u00e0n\n\n#### a. \u00d4 nguy\u00ean t\u1ed1\n- M\u1ed7i nguy\u00ean t\u1ed1 chi\u1ebfm m\u1ed9t \u00f4 trong BTH.\n- **S\u1ed1 th\u1ee9 t\u1ef1 \u00f4 nguy\u00ean t\u1ed1 = S\u1ed1 hi\u1ec7u nguy\u00ean t\u1eed ($Z$) = S\u1ed1 proton ($p$) = S\u1ed1 electron ($e$) = \u0110i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n ($+Z$)**.\n- V\u00ed d\u1ee5: \u00d4 s\u1ed1 11 $\\rightarrow Z = 11$, c\u00f3 11 proton, 11 electron.\n\n#### b. Chu k\u1ef3 (H\u00e0ng ngang)\n- Chu k\u1ef3 l\u00e0 d\u00e3y c\u00e1c nguy\u00ean t\u1ed1 m\u00e0 nguy\u00ean t\u1eed c\u1ee7a ch\u00fang c\u00f3 c\u00f9ng **s\u1ed1 l\u1edbp electron**, \u0111\u01b0\u1ee3c x\u1ebfp theo chi\u1ec1u \u0111i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n t\u0103ng d\u1ea7n.\n- **S\u1ed1 th\u1ee9 t\u1ef1 chu k\u1ef3 = S\u1ed1 l\u1edbp electron**.\n- BTH hi\u1ec7n nay g\u1ed3m c\u00f3 **7 chu k\u1ef3** (\u0111\u01b0\u1ee3c \u0111\u00e1nh s\u1ed1 t\u1eeb 1 \u0111\u1ebfn 7):\n  + **Chu k\u1ef3 nh\u1ecf:**\n    * Chu k\u1ef3 1: c\u00f3 2 nguy\u00ean t\u1ed1 (H, He), 1 l\u1edbp e.\n    * Chu k\u1ef3 2: c\u00f3 8 nguy\u00ean t\u1ed1 (t\u1eeb Li \u0111\u1ebfn Ne), 2 l\u1edbp e.\n    * Chu k\u1ef3 3: c\u00f3 8 nguy\u00ean t\u1ed1 (t\u1eeb Na \u0111\u1ebfn Ar), 3 l\u1edbp e.\n  + **Chu k\u1ef3 l\u1edbn:**\n    * Chu k\u1ef3 4: c\u00f3 18 nguy\u00ean t\u1ed1 (t\u1eeb K \u0111\u1ebfn Kr), 4 l\u1edbp e.\n    * Chu k\u1ef3 5: c\u00f3 18 nguy\u00ean t\u1ed1 (t\u1eeb Rb \u0111\u1ebfn Xe), 5 l\u1edbp e.\n    * Chu k\u1ef3 6: c\u00f3 32 nguy\u00ean t\u1ed1 (t\u1eeb Cs \u0111\u1ebfn Rn), g\u1ed3m h\u1ecd Lantan (14 nguy\u00ean t\u1ed1), 6 l\u1edbp e.\n    * Chu k\u1ef3 7: b\u1eaft \u0111\u1ea7u t\u1eeb Fr, hi\u1ec7n \u0111\u00e3 l\u1ea5p \u0111\u1ea7y \u0111\u1ee7 32 nguy\u00ean t\u1ed1, g\u1ed3m h\u1ecd Actini (14 nguy\u00ean t\u1ed1), 7 l\u1edbp e.\n- *L\u01b0u \u00fd quan tr\u1ecdng:* T\u1ea5t c\u1ea3 c\u00e1c chu k\u1ef3 (tr\u1eeb chu k\u1ef3 1) \u0111\u1ec1u b\u1eaft \u0111\u1ea7u b\u1eb1ng m\u1ed9t **kim lo\u1ea1i ki\u1ec1m** ($ns^1$) v\u00e0 k\u1ebft th\u00fac b\u1eb1ng m\u1ed9t **kh\u00ed hi\u1ebfm** ($ns^2np^6$, ri\u00eang He l\u00e0 $1s^2$).\n\n#### c. Nh\u00f3m nguy\u00ean t\u1ed1 (C\u1ed9t d\u1ecdc)\n- Nh\u00f3m g\u1ed3m c\u00e1c nguy\u00ean t\u1ed1 c\u00f3 c\u1ea5u h\u00ecnh electron t\u01b0\u01a1ng t\u1ef1 nhau, do \u0111\u00f3 c\u00f3 t\u00ednh ch\u1ea5t h\u00f3a h\u1ecdc g\u1ea7n gi\u1ed1ng nhau.\n- BTH g\u1ed3m **18 c\u1ed9t**, chia th\u00e0nh **8 nh\u00f3m A** (t\u1eeb IA \u0111\u1ebfn VIIIA) v\u00e0 **8 nh\u00f3m B** (t\u1eeb IB \u0111\u1ebfn VIIIB):\n  + **Nh\u00f3m A (Nguy\u00ean t\u1ed1 s v\u00e0 p):**\n    * **S\u1ed1 th\u1ee9 t\u1ef1 nh\u00f3m A = S\u1ed1 electron h\u00f3a tr\u1ecb = S\u1ed1 electron l\u1edbp ngo\u00e0i c\u00f9ng**.\n    * Nh\u00f3m IA: Kim lo\u1ea1i ki\u1ec1m (1 e ngo\u00e0i c\u00f9ng: $ns^1$, tr\u1eeb H).\n    * Nh\u00f3m IIA: Kim lo\u1ea1i ki\u1ec1m th\u1ed5 (2 e ngo\u00e0i c\u00f9ng: $ns^2$).\n    * Nh\u00f3m IIIA: 3 e ngo\u00e0i c\u00f9ng ($ns^2np^1$).\n    * Nh\u00f3m IVA: 4 e ngo\u00e0i c\u00f9ng ($ns^2np^2$).\n    * Nh\u00f3m VA: 5 e ngo\u00e0i c\u00f9ng ($ns^2np^3$).\n    * Nh\u00f3m VIA: 6 e ngo\u00e0i c\u00f9ng ($ns^2np^4$).\n    * Nh\u00f3m VIIA: Halogen (7 e ngo\u00e0i c\u00f9ng: $ns^2np^5$).\n    * Nh\u00f3m VIIIA: Kh\u00ed hi\u1ebfm (8 e ngo\u00e0i c\u00f9ng: $ns^2np^6$, ri\u00eang He c\u00f3 $1s^2$).\n  + **Nh\u00f3m B (Nguy\u00ean t\u1ed1 d v\u00e0 f - T\u1ea5t c\u1ea3 \u0111\u1ec1u l\u00e0 kim lo\u1ea1i chuy\u1ec3n ti\u1ebfp):**\n    * Electron h\u00f3a tr\u1ecb = electron l\u1edbp ngo\u00e0i c\u00f9ng ($ns$) + electron ph\u00e2n l\u1edbp s\u00e1t ngo\u00e0i c\u00f9ng ch\u01b0a b\u00e3o h\u00f2a ($(n-1)d$).\n    * C\u1ea5u h\u00ecnh t\u1ed5ng qu\u00e1t: $(n-1)d^a ns^b$ (v\u1edbi $b = 1$ ho\u1eb7c $2$; $a = 1 \\rightarrow 10$).\n    * \u0110\u1eb7t $S = a + b$:\n      - N\u1ebfu $S < 8$: Nh\u00f3m l\u00e0 $S\\text{B}$ (V\u00ed d\u1ee5: $3d^14s^2 \\rightarrow S=3 \\rightarrow$ nh\u00f3m IIIB; $3d^54s^2 \\rightarrow S=7 \\rightarrow$ nh\u00f3m VIIB).\n      - N\u1ebfu $S \\in \\{8, 9, 10\\}$: Nh\u00f3m l\u00e0 **VIIIB** (g\u1ed3m 3 c\u1ed9t: 8, 9, 10. V\u00ed d\u1ee5 Fe, Co, Ni).\n      - N\u1ebfu $S > 10$: Nh\u00f3m l\u00e0 $(S - 10)\\text{B}$ (V\u00ed d\u1ee5: Cu $3d^{10}4s^1 \\rightarrow S=11 \\rightarrow$ nh\u00f3m IB; Zn $3d^{10}4s^2 \\rightarrow S=12 \\rightarrow$ nh\u00f3m IIB).\n\n---\n\n### 3. Quy lu\u1eadt bi\u1ebfn \u0111\u1ed5i tu\u1ea7n ho\u00e0n (QUAN TR\u1eccNG NH\u1ea4T - \u0110\u1ec0 THI LU\u00d4N C\u00d3)\n\n| T\u00ednh ch\u1ea5t | Trong 1 Chu k\u1ef3 (T\u1eeb Tr\u00e1i $\\rightarrow$ Ph\u1ea3i) | Trong 1 Nh\u00f3m A (T\u1eeb Tr\u00ean $\\rightarrow$ D\u01b0\u1edbi) | Gi\u1ea3i th\u00edch c\u1ed1t l\u00f5i |\n| :--- | :--- | :--- | :--- |\n| **\u0110i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n ($Z$)** | T\u0103ng d\u1ea7n | T\u0103ng d\u1ea7n | S\u1ed1 proton t\u0103ng |\n| **S\u1ed1 l\u1edbp electron** | Kh\u00f4ng \u0111\u1ed5i (= STT chu k\u1ef3) | T\u0103ng d\u1ea7n (+1 l\u1edbp sau m\u1ed7i chu k\u1ef3) | Th\u00eam l\u1edbp v\u1ecf e m\u1edbi |\n| **B\u00e1n k\u00ednh nguy\u00ean t\u1eed ($r$)** | **GI\u1ea2M D\u1ea6N** | **T\u0102NG D\u1ea6N** | Trong 1 CK: $Z$ t\u0103ng, l\u1ef1c h\u00fat gi\u1eefa h\u1ea1t nh\u00e2n v\u1edbi e ngo\u00e0i c\u00f9ng t\u0103ng $\\rightarrow$ b\u00e1n k\u00ednh co l\u1ea1i. Trong 1 nh\u00f3m: s\u1ed1 l\u1edbp e t\u0103ng $\\rightarrow$ b\u00e1n k\u00ednh d\u00e3n r\u1ed9ng ra |\n| **\u0110\u1ed9 \u00e2m \u0111i\u1ec7n ($\\chi$)** | **T\u0102NG D\u1ea6N** | **GI\u1ea2M D\u1ea6N** | Kh\u1ea3 n\u0103ng h\u00fat e t\u0103ng theo l\u1ef1c h\u00fat h\u1ea1t nh\u00e2n |\n| **N\u0103ng l\u01b0\u1ee3ng ion h\u00f3a ($I_1$)** | Nh\u00ecn chung **T\u0102NG** | **GI\u1ea2M D\u1ea6N** | $r$ c\u00e0ng nh\u1ecf c\u00e0ng kh\u00f3 b\u1ee9t e ra kh\u1ecfi nguy\u00ean t\u1eed $\\rightarrow I_1$ t\u0103ng |\n| **T\u00ednh kim lo\u1ea1i (T\u00ednh kh\u1eed)** | **GI\u1ea2M D\u1ea6N** | **T\u0102NG D\u1ea6N** | Kh\u1ea3 n\u0103ng nh\u01b0\u1eddng e gi\u1ea3m khi h\u00fat e m\u1ea1nh |\n| **T\u00ednh phi kim (T\u00ednh oxi h\u00f3a)**| **T\u0102NG D\u1ea6N** | **GI\u1ea2M D\u1ea6N** | Kh\u1ea3 n\u0103ng nh\u1eadn e t\u0103ng khi h\u00fat e m\u1ea1nh |\n| **H\u00f3a tr\u1ecb cao nh\u1ea5t v\u1edbi O** | **T\u0103ng t\u1eeb 1 \u0111\u1ebfn 7** (= STT nh\u00f3m A) | Kh\u00f4ng \u0111\u1ed5i | $R_2O \\rightarrow RO \\rightarrow R_2O_3 \\rightarrow RO_2 \\rightarrow R_2O_5 \\rightarrow RO_3 \\rightarrow R_2O_7$ |\n| **H\u00f3a tr\u1ecb trong HC v\u1edbi H** | **Gi\u1ea3m t\u1eeb 4 v\u1ec1 1** (= $8 -$ STT nh\u00f3m A)| Kh\u00f4ng \u0111\u1ed5i | T\u1eeb nh\u00f3m IVA \u0111\u1ebfn VIIA: $RH_4 \\rightarrow RH_3 \\rightarrow RH_2 \\rightarrow RH$ |\n| **T\u00ednh acid c\u1ee7a oxide & hydroxide** | **T\u0102NG D\u1ea6N** | **GI\u1ea2M D\u1ea6N** | \u0110i theo xu h\u01b0\u1edbng c\u1ee7a t\u00ednh phi kim |\n| **T\u00ednh base c\u1ee7a oxide & hydroxide** | **GI\u1ea2M D\u1ea6N** | **T\u0102NG D\u1ea6N** | \u0110i theo xu h\u01b0\u1edbng c\u1ee7a t\u00ednh kim lo\u1ea1i |\n\n> \ud83d\udca1 **M\u1eb8O GHI NH\u1eda SI\u00caU T\u1ed0C:**\n> - C\u00f9ng chi\u1ec1u v\u1edbi **T\u00ednh kim lo\u1ea1i**: **B\u00e1n k\u00ednh nguy\u00ean t\u1eed**, **T\u00ednh base**. *(Nh\u1edb c\u00e2u: \"Kim lo\u1ea1i to b\u1ef1 th\u00edch base\")*\n> - C\u00f9ng chi\u1ec1u v\u1edbi **T\u00ednh phi kim**: **\u0110\u1ed9 \u00e2m \u0111i\u1ec7n**, **N\u0103ng l\u01b0\u1ee3ng ion h\u00f3a $I_1$**, **T\u00ednh acid**. *(Nh\u1edb c\u00e2u: \"Phi kim \u00e2m t\u00ednh h\u00fat acid\")*\n> - Nguy\u00ean t\u1ed1 c\u00f3 **t\u00ednh kim lo\u1ea1i m\u1ea1nh nh\u1ea5t** (kh\u00f4ng t\u00ednh ph\u00f3ng x\u1ea1): **Caesium ($Cs$)** \u1edf g\u00f3c d\u01b0\u1edbi c\u00f9ng b\u00ean tr\u00e1i BTH.\n> - Nguy\u00ean t\u1ed1 c\u00f3 **t\u00ednh phi kim m\u1ea1nh nh\u1ea5t**: **Fluorine ($F$)** \u1edf g\u00f3c tr\u00ean c\u00f9ng b\u00ean ph\u1ea3i BTH ($\\chi = 3,98$, kh\u00f4ng x\u00e9t kh\u00ed hi\u1ebfm).\n\n---\n\n### 4. \u0110\u1ecbnh lu\u1eadt tu\u1ea7n ho\u00e0n & M\u1ed1i quan h\u1ec7 t\u01b0\u01a1ng h\u1ed7\n- **\u0110\u1ecbnh lu\u1eadt tu\u1ea7n ho\u00e0n:** *\"T\u00ednh ch\u1ea5t c\u1ee7a c\u00e1c nguy\u00ean t\u1ed1 c\u0169ng nh\u01b0 th\u00e0nh ph\u1ea7n v\u00e0 t\u00ednh ch\u1ea5t c\u1ee7a c\u00e1c \u0111\u01a1n ch\u1ea5t v\u00e0 h\u1ee3p ch\u1ea5t t\u1ea1o n\u00ean t\u1eeb ch\u00fang bi\u1ebfn \u0111\u1ed5i tu\u1ea7n ho\u00e0n theo chi\u1ec1u t\u0103ng c\u1ee7a \u0111i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n nguy\u00ean t\u1eed.\"*\n- **Tam gi\u00e1c li\u00ean k\u1ebft:**\n  $$\\text{C\u1ea5u h\u00ecnh electron} \\longleftrightarrow \\text{V\u1ecb tr\u00ed trong BTH} \\longleftrightarrow \\text{T\u00ednh ch\u1ea5t h\u00f3a h\u1ecdc}$$\n  + T\u1eeb c\u1ea5u h\u00ecnh electron $\\rightarrow$ x\u00e1c \u0111\u1ecbnh $Z$ (\u00f4), s\u1ed1 l\u1edbp (chu k\u1ef3), s\u1ed1 e h\u00f3a tr\u1ecb (nh\u00f3m).\n  + T\u1eeb v\u1ecb tr\u00ed $\\rightarrow$ bi\u1ebft l\u00e0 kim lo\u1ea1i (1, 2, 3 e ngo\u00e0i c\u00f9ng), phi kim (5, 6, 7 e ngo\u00e0i c\u00f9ng) hay kh\u00ed hi\u1ebfm (8 e ngo\u00e0i c\u00f9ng).\n  + T\u1eeb v\u1ecb tr\u00ed $\\rightarrow$ suy ra c\u00f4ng th\u1ee9c oxide cao nh\u1ea5t v\u00e0 hydroxide t\u01b0\u01a1ng \u1ee9ng.\n\n---\n\n## \ud83c\udfaf PH\u1ea6N 2: PH\u00c2N D\u1ea0NG B\u00c0I T\u1eacP & C\u00d4NG TH\u1ee8C GI\u1ea2I NHANH \u0102N CH\u1eaeC \u0110I\u1ec2M 10\n\n### D\u1ea0NG 1: X\u00c1C \u0110\u1ecaNH V\u1eca TR\u00cd NGUY\u00caN T\u1ed0 V\u00c0 T\u00cdNH CH\u1ea4T D\u1ef0A V\u00c0O C\u1ea4U H\u00ccNH ELECTRON\n- **Quy t\u1eafc:**\n  1. Vi\u1ebft c\u1ea5u h\u00ecnh e \u0111\u1ea7y \u0111\u1ee7 t\u1eeb $Z$ (ho\u1eb7c t\u1eeb c\u1ea5u h\u00ecnh e suy ra $Z$).\n  2. S\u1ed1 th\u1ee9 t\u1ef1 \u00f4 = $Z$.\n  3. S\u1ed1 th\u1ee9 t\u1ef1 chu k\u1ef3 = S\u1ed1 l\u1edbp e (1, 2, 3, 4...).\n  4. X\u00e1c \u0111\u1ecbnh nguy\u00ean t\u1ed1 h\u1ecd g\u00ec:\n     - N\u1ebfu electron cu\u1ed1i c\u00f9ng \u0111i\u1ec1n v\u00e0o $s$ ho\u1eb7c $p \\rightarrow$ Nh\u00f3m A:\n       $$\\text{STT nh\u00f3m A} = \\text{T\u1ed5ng e l\u1edbp ngo\u00e0i c\u00f9ng } (ns + np)$$\n     - N\u1ebfu electron cu\u1ed1i c\u00f9ng \u0111i\u1ec1n v\u00e0o $d \\rightarrow$ Nh\u00f3m B:\n       $$\\text{C\u1ea5u h\u00ecnh s\u00e1t ngo\u00e0i v\u00e0 ngo\u00e0i: } (n-1)d^a ns^b \\rightarrow S = a+b$$\n       * $S < 8 \\rightarrow \\text{nh\u00f3m } S\\text{B}$\n       * $S \\in \\{8, 9, 10\\} \\rightarrow \\text{nh\u00f3m VIIIB}$\n       * $S > 10 \\rightarrow \\text{nh\u00f3m } (S-10)\\text{B}$\n- **V\u00ed d\u1ee5 m\u1eabu:**\n  + Nguy\u00ean t\u1eed $X$ c\u00f3 $Z = 17$: C\u1ea5u h\u00ecnh $1s^2 2s^2 2p^6 3s^2 3p^5$.\n    * \u00d4 s\u1ed1: 17.\n    * Chu k\u1ef3: 3 (c\u00f3 3 l\u1edbp e).\n    * Nh\u00f3m: VIIA (nguy\u00ean t\u1ed1 $p$, c\u00f3 $2+5=7$ electron l\u1edbp ngo\u00e0i c\u00f9ng).\n    * T\u00ednh ch\u1ea5t: Phi kim m\u1ea1nh (Halogen). Oxide cao nh\u1ea5t: $Cl_2O_7$ (acidic oxide), Hydroxide cao nh\u1ea5t: $HClO_4$ (acid r\u1ea5t m\u1ea1nh).\n\n---\n\n### D\u1ea0NG 2: B\u00c0I TO\u00c1N X\u00c1C \u0110\u1ecaNH 2 NGUY\u00caN T\u1ed0 THU\u1ed8C C\u00d9NG CHU K\u1ef2 HO\u1eb6C C\u00d9NG NH\u00d3M LI\u00caN TI\u1ebeP\n- **Tr\u01b0\u1eddng h\u1ee3p 1: Hai nguy\u00ean t\u1ed1 $A, B$ thu\u1ed9c c\u00f9ng m\u1ed9t chu k\u1ef3 v\u00e0 \u1edf 2 nh\u00f3m A li\u00ean ti\u1ebfp ($Z_A < Z_B$):**\n  $$Z_B - Z_A = 1$$\n  N\u1ebfu bi\u1ebft t\u1ed5ng $Z_A + Z_B = S \\Longrightarrow Z_A = \\frac{S - 1}{2}, \\quad Z_B = \\frac{S + 1}{2}$$\n\n- **Tr\u01b0\u1eddng h\u1ee3p 2: Hai nguy\u00ean t\u1ed1 $A, B$ thu\u1ed9c c\u00f9ng m\u1ed9t nh\u00f3m A v\u00e0 \u1edf 2 chu k\u1ef3 nh\u1ecf li\u00ean ti\u1ebfp (CK 2 v\u00e0 CK 3):**\n  $$Z_B - Z_A = 8$$\n  N\u1ebfu bi\u1ebft t\u1ed5ng $Z_A + Z_B = S \\Longrightarrow Z_A = \\frac{S - 8}{2}, \\quad Z_B = \\frac{S + 8}{2}$$\n\n- **Tr\u01b0\u1eddng h\u1ee3p 3: Hai nguy\u00ean t\u1ed1 thu\u1ed9c c\u00f9ng nh\u00f3m A \u1edf c\u00e1c chu k\u1ef3 l\u1edbn (CK 3 v\u00e0 4; ho\u1eb7c CK 4 v\u00e0 5):**\n  $$Z_B - Z_A = 18 \\quad (\\text{ho\u1eb7c } 32 \\text{ n\u1ebfu gi\u1eefa CK 5 v\u00e0 6})$$\n\n---\n\n### D\u1ea0NG 3: B\u00c0I TO\u00c1N H\u1ee2P CH\u1ea4T KH\u00cd V\u1edaI HYDROGEN V\u00c0 OXIDE CAO NH\u1ea4T\n- **Quy lu\u1eadt t\u1ed5ng h\u00f3a tr\u1ecb:**\n  $$\\text{H\u00f3a tr\u1ecb trong oxide cao nh\u1ea5t } (a) + \\text{H\u00f3a tr\u1ecb trong h\u1ee3p ch\u1ea5t v\u1edbi hydrogen } (b) = 8 \\quad (\\text{v\u1edbi c\u00e1c nh\u00f3m IVA } \\rightarrow \\text{VIIA})$$\n  + Nh\u00f3m IVA: Oxide $RO_2$, h\u1ee3p ch\u1ea5t kh\u00ed $RH_4$ ($a=4, b=4$).\n  + Nh\u00f3m VA: Oxide $R_2O_5$, h\u1ee3p ch\u1ea5t kh\u00ed $RH_3$ ($a=5, b=3$).\n  + Nh\u00f3m VIA: Oxide $RO_3$, h\u1ee3p ch\u1ea5t kh\u00ed $RH_2$ ($a=6, b=2$).\n  + Nh\u00f3m VIIA: Oxide $R_2O_7$, h\u1ee3p ch\u1ea5t kh\u00ed $RH$ ($a=7, b=1$).\n- **C\u00f4ng th\u1ee9c ph\u1ea7n tr\u0103m kh\u1ed1i l\u01b0\u1ee3ng:**\n  $$\\%m_R = \\frac{x \\cdot M_R}{x \\cdot M_R + y \\cdot 16} \\times 100\\%$$\n- **V\u00ed d\u1ee5 gi\u1ea3i nhanh:**\n  Nguy\u00ean t\u1ed1 $R$ c\u00f3 h\u1ee3p ch\u1ea5t kh\u00ed v\u1edbi hydrogen l\u00e0 $RH_3$. Trong oxide cao nh\u1ea5t, $O$ chi\u1ebfm $74,07\\%$ v\u1ec1 kh\u1ed1i l\u01b0\u1ee3ng. T\u00ecm $R$.\n  *Gi\u1ea3i:*\n  + Kh\u00ed v\u1edbi H l\u00e0 $RH_3 \\rightarrow$ h\u00f3a tr\u1ecb v\u1edbi H l\u00e0 $3 \\rightarrow$ H\u00f3a tr\u1ecb cao nh\u1ea5t v\u1edbi O l\u00e0 $8 - 3 = 5 \\rightarrow$ Oxide cao nh\u1ea5t l\u00e0 $R_2O_5$.\n  + $\\%m_O = \\frac{5 \\times 16}{2 \\cdot M_R + 5 \\times 16} = 0,7407 \\Longrightarrow \\frac{80}{2M_R + 80} = 0,7407$\n  + $2M_R + 80 = \\frac{80}{0,7407} \\approx 108 \\Longrightarrow 2M_R = 28 \\Longrightarrow M_R = 14 \\text{ (g/mol)}$.\n  + V\u1eady $R$ l\u00e0 Nitrogen ($N$).\n\n---\n\n### D\u1ea0NG 4: B\u00c0I TO\u00c1N KIM LO\u1ea0I NH\u00d3M IA, IIA T\u00c1C D\u1ee4NG V\u1edaI N\u01af\u1edaC HO\u1eb6C ACID\n- **Nh\u00f3m IA (Kim lo\u1ea1i ki\u1ec1m $M$ h\u00f3a tr\u1ecb I):**\n  $$2M + 2H_2O \\longrightarrow 2MOH + H_2 \\uparrow$$\n  $$n_M = 2 \\cdot n_{H_2} \\Longrightarrow \\bar{M} = \\frac{m_{\\text{h\u1ed7n h\u1ee3p}}}{2 \\cdot n_{H_2}}$$\n  *(C\u00e1c kim lo\u1ea1i ki\u1ec1m: $Li(7) < Na(23) < K(39) < Rb(85,5) < Cs(133)$)*\n\n- **Nh\u00f3m IIA (Kim lo\u1ea1i ki\u1ec1m th\u1ed5 $R$ h\u00f3a tr\u1ecb II):**\n  $$R + 2H_2O \\longrightarrow R(OH)_2 + H_2 \\uparrow$$\n  $$R + 2HCl \\longrightarrow RCl_2 + H_2 \\uparrow$$\n  $$n_R = n_{H_2} \\Longrightarrow \\bar{R} = \\frac{m_{\\text{h\u1ed7n h\u1ee3p}}}{n_{H_2}}$$\n  *(C\u00e1c kim lo\u1ea1i ki\u1ec1m th\u1ed5: $Be(9) < Mg(24) < Ca(40) < Sr(87,6) < Ba(137)$)*\n\n---\n\n## \ud83d\udcdd PH\u1ea6N 3: L\u1edcI GI\u1ea2I CHI TI\u1ebeT T\u1eeaNG B\u00c0I T\u1eacP TRONG 40 \u1ea2NH \u0110\u1ec0 THI\n\n#### C\u00e2u 1: B\u1ea3ng tu\u1ea7n ho\u00e0n h\u00f3a h\u1ecdc hi\u1ec7n nay c\u00f3 bao nhi\u00eau nguy\u00ean t\u1ed1 h\u00f3a h\u1ecdc?\n- **\u0110\u00e1p \u00e1n:** 118 nguy\u00ean t\u1ed1 h\u00f3a h\u1ecdc (\u0111\u00e3 \u0111\u01b0\u1ee3c IUPAC c\u00f4ng nh\u1eadn \u0111\u1ea7y \u0111\u1ee7 t\u1eeb nguy\u00ean t\u1ed1 1 - H \u0111\u1ebfn 118 - Og).\n\n#### C\u00e2u 2: B\u1ea3ng tu\u1ea7n ho\u00e0n h\u00f3a h\u1ecdc hi\u1ec7n nay c\u00f3 bao nhi\u00eau chu k\u00ec?\n- **\u0110\u00e1p \u00e1n:** 7 chu k\u00ec (g\u1ed3m chu k\u00ec 1, 2, 3 l\u00e0 chu k\u00ec nh\u1ecf; chu k\u00ec 4, 5, 6, 7 l\u00e0 chu k\u00ec l\u1edbn).\n\n#### C\u00e2u 3: B\u1ea3ng tu\u1ea7n ho\u00e0n h\u00f3a h\u1ecdc hi\u1ec7n nay c\u00f3 bao nhi\u00eau nh\u00f3m A?\n- **\u0110\u00e1p \u00e1n:** 8 nh\u00f3m A (\u0111\u00e1nh s\u1ed1 t\u1eeb IA \u0111\u1ebfn VIIIA).\n\n#### C\u00e2u 4: B\u1ea3ng tu\u1ea7n ho\u00e0n h\u00f3a h\u1ecdc hi\u1ec7n nay c\u00f3 t\u1ed5ng c\u1ed9ng bao nhi\u00eau c\u1ed9t?\n- **\u0110\u00e1p \u00e1n:** 18 c\u1ed9t (g\u1ed3m 8 c\u1ed9t nh\u00f3m A v\u00e0 10 c\u1ed9t nh\u00f3m B, trong \u0111\u00f3 nh\u00f3m VIIIB chi\u1ebfm 3 c\u1ed9t).\n\n#### C\u00e2u 5: Cho nguy\u00ean t\u1ed1 Fluorine ($Z = 9, A = 19$). X\u00e1c \u0111\u1ecbnh v\u1ecb tr\u00ed c\u1ee7a Fluorine trong BTH.\n- **Gi\u1ea3i:**\n  + C\u1ea5u h\u00ecnh e: $1s^2 2s^2 2p^5$.\n  + S\u1ed1 electron = 9 $\\rightarrow$ \u00d4 s\u1ed1 9.\n  + C\u00f3 2 l\u1edbp e $\\rightarrow$ Chu k\u1ef3 2.\n  + Electron cu\u1ed1i c\u00f9ng \u0111i\u1ec1n v\u00e0o ph\u00e2n l\u1edbp $p$, c\u00f3 7 e l\u1edbp ngo\u00e0i c\u00f9ng ($2s^2 2p^5$) $\\rightarrow$ Nh\u00f3m VIIA.\n\n#### C\u00e2u 6: Cho nguy\u00ean t\u1ed1 Sodium ($Z = 11, A = 23$). X\u00e1c \u0111\u1ecbnh v\u1ecb tr\u00ed c\u1ee7a Sodium trong BTH.\n- **Gi\u1ea3i:**\n  + C\u1ea5u h\u00ecnh e: $1s^2 2s^2 2p^6 3s^1$ (vi\u1ebft g\u1ecdn: $[Ne]3s^1$).\n  + \u00d4 s\u1ed1 11, Chu k\u1ef3 3 (3 l\u1edbp e), Nh\u00f3m IA (nguy\u00ean t\u1ed1 $s$, 1 e l\u1edbp ngo\u00e0i c\u00f9ng).\n\n#### C\u00e2u 7: Trong b\u1ea3ng tu\u1ea7n ho\u00e0n, c\u00e1c nguy\u00ean t\u1ed1 \u1edf chu k\u00ec 4 c\u00f3 bao nhi\u00eau l\u1edbp electron?\n- **\u0110\u00e1p \u00e1n:** 4 l\u1edbp electron (STT chu k\u1ef3 = s\u1ed1 l\u1edbp electron).\n\n#### C\u00e2u 8: Trong b\u1ea3ng tu\u1ea7n ho\u00e0n, c\u00e1c nguy\u00ean t\u1ed1 \u1edf nh\u00f3m IA c\u00f3 bao nhi\u00eau electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng?\n- **\u0110\u00e1p \u00e1n:** 1 electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng ($ns^1$, tr\u1eeb H).\n\n#### C\u00e2u 9: Trong b\u1ea3ng tu\u1ea7n ho\u00e0n, c\u00e1c nguy\u00ean t\u1ed1 \u1edf nh\u00f3m VIIA c\u00f3 bao nhi\u00eau electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng?\n- **\u0110\u00e1p \u00e1n:** 7 electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng ($ns^2np^5$).\n\n#### C\u00e2u 10: Trong b\u1ea3ng tu\u1ea7n ho\u00e0n, c\u00f3 bao nhi\u00eau nguy\u00ean t\u1ed1 thu\u1ed9c chu k\u00ec 3?\n- **\u0110\u00e1p \u00e1n:** 8 nguy\u00ean t\u1ed1 (t\u1eeb $Na$ \u0111\u1ebfn $Ar$).\n\n#### C\u00e2u 11: Trong b\u1ea3ng tu\u1ea7n ho\u00e0n, c\u00f3 bao nhi\u00eau nguy\u00ean t\u1ed1 thu\u1ed9c chu k\u00ec 5?\n- **\u0110\u00e1p \u00e1n:** 18 nguy\u00ean t\u1ed1 (t\u1eeb $Rb$ \u0111\u1ebfn $Xe$).\n\n#### C\u00e2u 12: C\u00e1c nguy\u00ean t\u1eed kh\u00ed hi\u1ebfm (tr\u1eeb Helium) c\u00f3 bao nhi\u00eau electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng?\n- **\u0110\u00e1p \u00e1n:** 8 electron \u1edf l\u1edbp ngo\u00e0i c\u00f9ng (c\u1ea5u h\u00ecnh b\u1ec1n v\u1eefng $ns^2np^6$).\n\n#### C\u00e2u 13: S\u1ed1 electron h\u00f3a tr\u1ecb c\u1ee7a nguy\u00ean t\u1eed Calcium ($Z = 20$) l\u00e0 bao nhi\u00eau?\n- **Gi\u1ea3i:** C\u1ea5u h\u00ecnh e c\u1ee7a Ca: $[Ar]4s^2$. V\u00ec l\u00e0 nguy\u00ean t\u1ed1 nh\u00f3m A n\u00ean s\u1ed1 e h\u00f3a tr\u1ecb = s\u1ed1 e l\u1edbp ngo\u00e0i c\u00f9ng = 2.\n\n#### C\u00e2u 14: S\u1ed1 electron h\u00f3a tr\u1ecb c\u1ee7a nguy\u00ean t\u1eed Iron ($Z = 26$) l\u00e0 bao nhi\u00eau?\n- **Gi\u1ea3i:** C\u1ea5u h\u00ecnh e c\u1ee7a Fe: $[Ar]3d^64s^2$. V\u00ec Fe l\u00e0 nguy\u00ean t\u1ed1 $d$ (nh\u00f3m B), e h\u00f3a tr\u1ecb g\u1ed3m c\u1ea3 ph\u00e2n l\u1edbp $3d$ ch\u01b0a b\u00e3o h\u00f2a v\u00e0 $4s \\rightarrow$ S\u1ed1 e h\u00f3a tr\u1ecb = $6 + 2 = 8$.\n\n#### C\u00e2u 15: Cho c\u1ea5u h\u00ecnh electron c\u1ee7a nguy\u00ean t\u1eed Manganese: $[Ar]3d^54s^2$. V\u1ecb tr\u00ed c\u1ee7a nguy\u00ean t\u1ed1 Manganese trong BTH l\u00e0 g\u00ec?\n- **Gi\u1ea3i:**\n  + $Z = 18 + 5 + 2 = 25 \\rightarrow$ \u00d4 s\u1ed1 25.\n  + C\u00f3 4 l\u1edbp e ($n=4$) $\\rightarrow$ Chu k\u1ef3 4.\n  + Ph\u00e2n l\u1edbp \u0111ang \u0111i\u1ec1n d\u1edf l\u00e0 $3d$, t\u1ed5ng s\u1ed1 e h\u00f3a tr\u1ecb $S = 5 + 2 = 7 \\rightarrow$ Nh\u00f3m VIIB.\n\n#### C\u00e2u 16: D\u00e3y c\u00e1c nguy\u00ean t\u1ed1 n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c x\u1ebfp theo chi\u1ec1u t\u0103ng d\u1ea7n c\u1ee7a b\u00e1n k\u00ednh nguy\u00ean t\u1eed?\nA. $F < O < N < C$  \nB. $C < N < O < F$  \nC. $F < Cl < Br < I$  \n- **Gi\u1ea3i:**\n  + C\u00e1c nguy\u00ean t\u1ed1 $C, N, O, F$ c\u00f9ng thu\u1ed9c chu k\u1ef3 2. \u0110i t\u1eeb tr\u00e1i sang ph\u1ea3i: b\u00e1n k\u00ednh **gi\u1ea3m d\u1ea7n** $\\rightarrow C > N > O > F \\rightarrow F < O < N < C$.\n  + V\u1eady chi\u1ec1u t\u0103ng d\u1ea7n b\u00e1n k\u00ednh \u0111\u00fang l\u00e0: $F < O < N < C$. (\u0110\u00e1p \u00e1n A).\n\n#### C\u00e2u 17: D\u00e3y c\u00e1c nguy\u00ean t\u1ed1 n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c x\u1ebfp theo chi\u1ec1u gi\u1ea3m d\u1ea7n t\u00ednh phi kim?\n- **Gi\u1ea3i:**\n  + X\u00e9t nh\u00f3m Halogen (nh\u00f3m VIIA): $F, Cl, Br, I$. \u0110i t\u1eeb tr\u00ean xu\u1ed1ng d\u01b0\u1edbi, t\u00ednh phi kim gi\u1ea3m d\u1ea7n:\n    $$F > Cl > Br > I$$\n  + Trong chu k\u1ef3 3: $Cl > S > P > Si$ (t\u00ednh phi kim gi\u1ea3m d\u1ea7n t\u1eeb ph\u1ea3i sang tr\u00e1i).\n\n#### C\u00e2u 18: D\u00e3y c\u00e1c hydroxide n\u00e0o sau \u0111\u00e2y \u0111\u01b0\u1ee3c x\u1ebfp theo chi\u1ec1u t\u0103ng d\u1ea7n t\u00ednh base?\n- **Gi\u1ea3i:**\n  + Trong c\u00f9ng nh\u00f3m IA: $LiOH < NaOH < KOH < RbOH < CsOH$ (t\u00ednh base t\u0103ng t\u1eeb tr\u00ean xu\u1ed1ng d\u01b0\u1edbi).\n  + Trong c\u00f9ng chu k\u1ef3 3: $Al(OH)_3 < Mg(OH)_2 < NaOH$ (t\u00ednh base t\u0103ng t\u1eeb ph\u1ea3i sang tr\u00e1i).\n\n#### C\u00e2u 19: Cho c\u00e1c nguy\u00ean t\u1ed1 $X (Z=11), Y (Z=12), Z (Z=19)$. So s\u00e1nh b\u00e1n k\u00ednh nguy\u00ean t\u1eed c\u1ee7a $X, Y, Z$.\n- **Gi\u1ea3i:**\n  + $X (Z=11): [Ne]3s^1$ (Chu k\u1ef3 3, nh\u00f3m IA).\n  + $Y (Z=12): [Ne]3s^2$ (Chu k\u1ef3 3, nh\u00f3m IIA).\n  + $Z (Z=19): [Ar]4s^1$ (Chu k\u1ef3 4, nh\u00f3m IA).\n  + So s\u00e1nh $X$ v\u00e0 $Y$ (c\u00f9ng CK 3): \u0110i t\u1eeb tr\u00e1i sang ph\u1ea3i, b\u00e1n k\u00ednh gi\u1ea3m $\\rightarrow r_X > r_Y$.\n  + So s\u00e1nh $X$ v\u00e0 $Z$ (c\u00f9ng nh\u00f3m IA): \u0110i t\u1eeb tr\u00ean xu\u1ed1ng d\u01b0\u1edbi, b\u00e1n k\u00ednh t\u0103ng $\\rightarrow r_Z > r_X$.\n  + K\u1ebft lu\u1eadn: $r_Z > r_X > r_Y$ (hay $r_Y < r_X < r_Z$).\n\n#### C\u00e2u 20 (B\u00e0i to\u00e1n h\u1ed7n h\u1ee3p kim lo\u1ea1i ki\u1ec1m): Cho 3,1 gam h\u1ed7n h\u1ee3p 2 kim lo\u1ea1i ki\u1ec1m thu\u1ed9c 2 chu k\u1ef3 li\u00ean ti\u1ebfp t\u00e1c d\u1ee5ng ho\u00e0n to\u00e0n v\u1edbi n\u01b0\u1edbc thu \u0111\u01b0\u1ee3c 1,2395 l\u00edt kh\u00ed $H_2$ (\u0111kc \u1edf $25^\\circ\\text{C}, 1 \\text{ bar}$, t\u01b0\u01a1ng \u1ee9ng $n = \\frac{1,2395}{24,79} = 0,05 \\text{ mol}$). X\u00e1c \u0111\u1ecbnh t\u00ean hai kim lo\u1ea1i.\n- **L\u1eddi gi\u1ea3i chi ti\u1ebft:**\n  + Ph\u01b0\u01a1ng tr\u00ecnh ph\u1ea3n \u1ee9ng chung:\n    $$2\\bar{M} + 2H_2O \\longrightarrow 2\\bar{M}OH + H_2 \\uparrow$$\n  + Theo ph\u01b0\u01a1ng tr\u00ecnh: $n_{\\bar{M}} = 2 \\cdot n_{H_2} = 2 \\times 0,05 = 0,1 \\text{ mol}$.\n  + Kh\u1ed1i l\u01b0\u1ee3ng mol trung b\u00ecnh c\u1ee7a 2 kim lo\u1ea1i:\n    $$\\bar{M} = \\frac{m_{\\text{h\u1ed7n h\u1ee3p}}}{n_{\\bar{M}}} = \\frac{3,1}{0,1} = 31 \\text{ (g/mol)}$$\n  + V\u00ec 2 kim lo\u1ea1i thu\u1ed9c ph\u00e2n nh\u00f3m ch\u00ednh nh\u00f3m I (nh\u00f3m IA) v\u00e0 \u1edf 2 chu k\u1ef3 li\u00ean ti\u1ebfp n\u00ean:\n    $$M_A < 31 < M_B$$\n  + Tra b\u1ea3ng c\u00e1c kim lo\u1ea1i ki\u1ec1m nh\u00f3m IA: $Li(7), Na(23), K(39), Rb(85,5), Cs(133)$. Ta th\u1ea5y: $23 < 31 < 39$.\n  + V\u1eady hai kim lo\u1ea1i c\u1ea7n t\u00ecm l\u00e0 **Sodium ($Na = 23$)** v\u00e0 **Potassium ($K = 39$)**.\n\n---\n\n## \u26a1 PH\u1ea6N 4: 10 C\u00c2U TEST NHANH TR\u01af\u1edaC KHI \u0110I NG\u1ee6 (K\u00c8M KEY)\n1. **C\u00e2u 1:** Nguy\u00ean t\u1ed1 \u1edf chu k\u1ef3 3, nh\u00f3m VIA c\u00f3 c\u1ea5u h\u00ecnh e h\u00f3a tr\u1ecb l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $3s^23p^4$ ($S$).\n2. **C\u00e2u 2:** Oxide cao nh\u1ea5t c\u1ee7a nguy\u00ean t\u1ed1 nh\u00f3m VA c\u00f3 c\u00f4ng th\u1ee9c chung l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $R_2O_5$.\n3. **C\u00e2u 3:** H\u1ee3p ch\u1ea5t kh\u00ed v\u1edbi hydrogen c\u1ee7a nguy\u00ean t\u1ed1 nh\u00f3m VIA c\u00f3 c\u00f4ng th\u1ee9c chung l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $RH_2$ (ho\u1eb7c $H_2R$).\n4. **C\u00e2u 4:** Trong m\u1ed9t chu k\u1ef3, theo chi\u1ec1u t\u0103ng \u0111i\u1ec7n t\u00edch h\u1ea1t nh\u00e2n, t\u00ednh kim lo\u1ea1i bi\u1ebfn \u0111\u1ed5i th\u1ebf n\u00e0o? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Gi\u1ea3m d\u1ea7n.\n5. **C\u00e2u 5:** Phi kim m\u1ea1nh nh\u1ea5t trong BTH l\u00e0 nguy\u00ean t\u1ed1 n\u00e0o? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Fluorine ($F$).\n6. **C\u00e2u 6:** Acid n\u00e0o m\u1ea1nh nh\u1ea5t trong d\u00e3y c\u00e1c acid ch\u1ee9a oxy c\u1ee7a halogen: $HClO, HClO_2, HClO_3, HClO_4$? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $HClO_4$ (Perchloric acid).\n7. **C\u00e2u 7:** Nguy\u00ean t\u1ed1 $X$ c\u00f3 $Z=15$, oxide cao nh\u1ea5t c\u1ee7a n\u00f3 c\u00f3 t\u00ednh ch\u1ea5t g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $P_2O_5$ l\u00e0 acidic oxide (oxide acid).\n8. **C\u00e2u 8:** C\u1ea5u h\u00ecnh electron c\u1ee7a ion $Al^{3+}$ ($Z=13$) l\u00e0 g\u00ec? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** $1s^2 2s^2 2p^6$ (gi\u1ed1ng kh\u00ed hi\u1ebfm $Ne$).\n9. **C\u00e2u 9:** Nh\u00f3m n\u00e0o trong BTH c\u00f2n \u0111\u01b0\u1ee3c g\u1ecdi l\u00e0 nh\u00f3m kh\u00ed hi\u1ebfm? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** Nh\u00f3m VIIIA.\n10. **C\u00e2u 10:** Cho 2 nguy\u00ean t\u1ed1 $X (Z=8)$ v\u00e0 $Y (Z=16)$, ch\u00fang c\u00f3 \u0111i\u1ec3m g\u00ec chung? $\\rightarrow$ **\u0110\u00e1p \u00e1n:** C\u00f9ng thu\u1ed9c nh\u00f3m VIA, c\u00f3 6 electron l\u1edbp ngo\u00e0i c\u00f9ng.\n";
