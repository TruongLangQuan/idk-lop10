  <script>
    const markdownText = "# L\u1edcI GI\u1ea2I TO\u00c0N DI\u1ec6N V\u00c0 CHI TI\u1ebeT 100% B\u00c0I T\u1eacP TO\u00c1N 10 - CH\u01af\u01a0NG VECT\u01a0\n*(Tr\u1ecdn v\u1eb9n 8 trang: t\u1eeb Trang 46 \u0111\u1ebfn Trang 53 - T\u1ec7p Photos-1-001(2).zip)*\n\n---\n\n# M\u1ee4C L\u1ee4C T\u1ed4NG H\u1ee2P N\u1ed8I DUNG\n1. **TRANG 46**: C\u00e1c b\u00e0i to\u00e1n th\u1ef1c t\u1ebf v\u1ec1 l\u1ef1c c\u00e2n b\u1eb1ng, g\u00f3c h\u1ee3p l\u1ef1c v\u00e0 \u0111\u1ed9 d\u00e0i vect\u01a1 (C\u00e2u 21, 22, 23, 24, 25).\n2. **TRANG 47**: \n   - Ph\u1ea7n T\u1ef1 lu\u1eadn: C\u00e2u 6 (H\u1ec7 th\u1ee9c vect\u01a1 trung \u0111i\u1ec3m t\u1ee9 gi\u00e1c), C\u00e2u 27 (D\u1ef1ng \u0111i\u1ec3m v\u00e0 ph\u00e2n t\u00edch vect\u01a1).\n   - Ph\u1ea7n B.2 Tr\u1eafc nghi\u1ec7m 4 l\u1ef1a ch\u1ecdn: C\u00e2u 1, 2, 3, 4, 5, 6.\n3. **TRANG 48**: Tr\u1eafc nghi\u1ec7m 4 l\u1ef1a ch\u1ecdn t\u1eeb C\u00e2u 7 \u0111\u1ebfn C\u00e2u 17.\n4. **TRANG 49**: Tr\u1eafc nghi\u1ec7m 4 l\u1ef1a ch\u1ecdn t\u1eeb C\u00e2u 18 \u0111\u1ebfn C\u00e2u 26.\n5. **TRANG 50**: \n   - Tr\u1eafc nghi\u1ec7m 4 l\u1ef1a ch\u1ecdn: C\u00e2u 27, 28, 29.\n   - Ph\u1ea7n B.3 Tr\u1eafc nghi\u1ec7m \u0110\u00fang / Sai: C\u00e2u 1, 2, 3, 4, 5.\n6. **TRANG 51**: Tr\u1eafc nghi\u1ec7m \u0110\u00fang / Sai t\u1eeb C\u00e2u 6 \u0111\u1ebfn C\u00e2u 12.\n7. **TRANG 52**: \n   - Tr\u1eafc nghi\u1ec7m \u0110\u00fang / Sai: C\u00e2u 13, C\u00e2u 14.\n   - Ph\u1ea7n B.4 Tr\u1eafc nghi\u1ec7m tr\u1ea3 l\u1eddi ng\u1eafn: C\u00e2u 1, 2, 3, 4, 5, 6.\n8. **TRANG 53**: Tr\u1eafc nghi\u1ec7m tr\u1ea3 l\u1eddi ng\u1eafn C\u00e2u 7, 8.\n\n---\n\n# PH\u1ea6N 1: B\u00c0I T\u1eacP TRANG 46 (B\u00c0I TO\u00c1N L\u1ef0C & H\u00ccNH H\u1eccC)\n\n### C\u00e2u 21 (Trang 46):\n**\u0110\u1ec1 b\u00e0i:** Cho ba l\u1ef1c $\\vec{F}_1 = \\vec{MA}, \\vec{F}_2 = \\vec{MB}, \\vec{F}_3 = \\vec{MC}$ c\u00f9ng t\u00e1c \u0111\u1ed9ng v\u00e0o m\u1ed9t \u00f4 t\u00f4 t\u1ea1i \u0111i\u1ec3m $M$ v\u00e0 \u00f4 t\u00f4 \u0111\u1ee9ng y\u00ean. Cho bi\u1ebft c\u01b0\u1eddng \u0111\u1ed9 hai l\u1ef1c $\\vec{F}_1, \\vec{F}_2$ \u0111\u1ec1u b\u1eb1ng $25\\text{ N}$ v\u00e0 g\u00f3c $\\widehat{AMB} = 60^\\circ$. T\u00ednh c\u01b0\u1eddng \u0111\u1ed9 l\u1ef1c $\\vec{F}_3$ (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **Ph\u01b0\u01a1ng ph\u00e1p gi\u1ea3i:**\n  - \u00d4 t\u00f4 \u0111\u1ee9ng y\u00ean n\u00ean h\u1ee3p l\u1ef1c b\u1eb1ng $\\vec{0}$: $\\vec{F}_1 + \\vec{F}_2 + \\vec{F}_3 = \\vec{0} \\Rightarrow \\vec{F}_3 = -(\\vec{F}_1 + \\vec{F}_2)$.\n  - \u0110\u1ed9 l\u1edbn c\u1ee7a l\u1ef1c $\\vec{F}_3$:\n    $$F_3 = |\\vec{F}_1 + \\vec{F}_2| = \\sqrt{F_1^2 + F_2^2 + 2F_1 F_2 \\cos(\\widehat{AMB})}$$\n  - Thay s\u1ed1:\n    $$F_3 = \\sqrt{25^2 + 25^2 + 2 \\times 25 \\times 25 \\times \\cos 60^\\circ} = \\sqrt{625 + 625 + 2 \\times 625 \\times 0{,}5} = \\sqrt{1875} = 25\\sqrt{3} \\approx 43{,}30\\text{ N}$$\n- **\u0110\u00e1p s\u1ed1:** **$43{,}30\\text{ N}$**.\n\n---\n\n### C\u00e2u 22 (Trang 46):\n**\u0110\u1ec1 b\u00e0i:** Cho hai l\u1ef1c $\\vec{F}_1, \\vec{F}_2$ \u0111\u1ec1u c\u00f3 c\u01b0\u1eddng \u0111\u1ed9 b\u1eb1ng $100\\text{ N}$ v\u00e0 c\u00f3 c\u00f9ng \u0111i\u1ec3m \u0111\u1eb7t t\u1ea1i m\u1ed9t \u0111i\u1ec3m. G\u00f3c h\u1ee3p b\u1edfi $\\vec{F}_1$ v\u00e0 $\\vec{F}_2$ b\u1eb1ng $90^\\circ$. Khi \u0111\u00f3 t\u00ednh c\u01b0\u1eddng \u0111\u1ed9 l\u1ef1c t\u1ed5ng h\u1ee3p c\u1ee7a $\\vec{F}_1$ v\u00e0 $\\vec{F}_2$ (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn h\u00e0ng \u0111\u01a1n v\u1ecb).\n- **Ph\u01b0\u01a1ng ph\u00e1p gi\u1ea3i:**\n  - L\u1ef1c t\u1ed5ng h\u1ee3p: $\\vec{F} = \\vec{F}_1 + \\vec{F}_2$.\n  - V\u00ec g\u00f3c gi\u1eefa hai l\u1ef1c b\u1eb1ng $90^\\circ$ ($\\vec{F}_1 \\perp \\vec{F}_2$) n\u00ean theo \u0111\u1ecbnh l\u00fd Pythagore:\n    $$F = |\\vec{F}| = \\sqrt{F_1^2 + F_2^2} = \\sqrt{100^2 + 100^2} = 100\\sqrt{2} \\approx 141{,}42\\text{ N}$$\n  - L\u00e0m tr\u00f2n \u0111\u1ebfn h\u00e0ng \u0111\u01a1n v\u1ecb: **$141\\text{ N}$**.\n- **\u0110\u00e1p s\u1ed1:** **$141\\text{ N}$**.\n\n---\n\n### C\u00e2u 23 (Trang 46):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ vu\u00f4ng t\u1ea1i $A$ c\u00f3 $AB = 3, AC = 4$ (ho\u1eb7c $AC = 5$). T\u00ednh \u0111\u1ed9 d\u00e0i vect\u01a1 t\u1ed5ng $\\vec{AB} + \\vec{AC}$.\n- **Ph\u01b0\u01a1ng ph\u00e1p gi\u1ea3i:**\n  - D\u1ef1ng \u0111i\u1ec3m $D$ sao cho t\u1ee9 gi\u00e1c $ABDC$ l\u00e0 h\u00ecnh ch\u1eef nh\u1eadt. Theo quy t\u1eafc h\u00ecnh b\u00ecnh h\u00e0nh: $\\vec{AB} + \\vec{AC} = \\vec{AD}$.\n  - Do tam gi\u00e1c $ABC$ vu\u00f4ng t\u1ea1i $A$, \u0111\u1ed9 d\u00e0i \u0111\u01b0\u1eddng ch\u00e9o h\u00ecnh ch\u1eef nh\u1eadt:\n    $$|\\vec{AB} + \\vec{AC}| = AD = BC = \\sqrt{AB^2 + AC^2} = \\sqrt{3^2 + 4^2} = 5$$\n- **\u0110\u00e1p s\u1ed1:** **$5$**.\n\n---\n\n### C\u00e2u 24 (Trang 46):\n**\u0110\u1ec1 b\u00e0i:** Cho hai l\u1ef1c $\\vec{F}_1, \\vec{F}_2$ c\u00f3 \u0111i\u1ec3m \u0111\u1eb7t t\u1ea1i $O$ t\u1ea1o v\u1edbi nhau g\u00f3c $60^\\circ$, bi\u1ebft r\u1eb1ng c\u01b0\u1eddng \u0111\u1ed9 c\u1ee7a hai l\u1ef1c \u0111\u1ec1u b\u1eb1ng $100\\text{ N}$. T\u00ednh c\u01b0\u1eddng \u0111\u1ed9 l\u1ef1c t\u1ed5ng h\u1ee3p c\u1ee7a hai l\u1ef1c tr\u00ean (l\u00e0m tr\u00f2n \u0111\u1ebfn h\u00e0ng \u0111\u01a1n v\u1ecb).\n- **Ph\u01b0\u01a1ng ph\u00e1p gi\u1ea3i:**\n  $$F = \\sqrt{F_1^2 + F_2^2 + 2F_1 F_2 \\cos 60^\\circ} = \\sqrt{100^2 + 100^2 + 2 \\times 100 \\times 100 \\times 0{,}5} = \\sqrt{30000} = 100\\sqrt{3} \\approx 173{,}2\\text{ N}$$\n  - L\u00e0m tr\u00f2n \u0111\u1ebfn h\u00e0ng \u0111\u01a1n v\u1ecb: **$173\\text{ N}$**.\n- **\u0110\u00e1p s\u1ed1:** **$173\\text{ N}$**.\n\n---\n\n# PH\u1ea6N 2: B\u00c0I T\u1eacP TRANG 47\n\n## I. T\u1ef0 LU\u1eacN\n### C\u00e2u 6 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** Cho t\u1ee9 gi\u00e1c $ABCD$. G\u1ecdi $I, J$ l\u1ea7n l\u01b0\u1ee3t l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AB$ v\u00e0 $CD$, $O$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $IJ$. Ch\u1ee9ng minh r\u1eb1ng:\na) $\\vec{AC} + \\vec{BD} = 2\\vec{IJ}$  \nb) $\\vec{OA} + \\vec{OB} + \\vec{OC} + \\vec{OD} = \\vec{0}$  \nc) $\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = 4\\vec{MO}$ v\u1edbi $M$ l\u00e0 \u0111i\u1ec3m b\u1ea5t k\u1ef3.\n\n**L\u1eddi gi\u1ea3i chi ti\u1ebft:**\n- **C\u00e2u a:**\n  - Ch\u00e8n \u0111i\u1ec3m $I$ v\u00e0 $J$ v\u00e0o:\n    $$\\vec{AC} = \\vec{AI} + \\vec{IJ} + \\vec{JC}$$\n    $$\\vec{BD} = \\vec{BI} + \\vec{IJ} + \\vec{JD}$$\n  - C\u1ed9ng l\u1ea1i: $\\vec{AC} + \\vec{BD} = (\\vec{AI} + \\vec{BI}) + 2\\vec{IJ} + (\\vec{JC} + \\vec{JD})$.\n  - Do $I$ l\u00e0 trung \u0111i\u1ec3m $AB \\Rightarrow \\vec{AI} + \\vec{BI} = \\vec{0}$; $J$ l\u00e0 trung \u0111i\u1ec3m $CD \\Rightarrow \\vec{JC} + \\vec{JD} = \\vec{0}$.\n  - V\u1eady $\\vec{AC} + \\vec{BD} = 2\\vec{IJ}$ (\u0111pcm).\n- **C\u00e2u b:**\n  - Do $I$ l\u00e0 trung \u0111i\u1ec3m $AB \\Rightarrow \\vec{OA} + \\vec{OB} = 2\\vec{OI}$.\n  - Do $J$ l\u00e0 trung \u0111i\u1ec3m $CD \\Rightarrow \\vec{OC} + \\vec{OD} = 2\\vec{OJ}$.\n  - C\u1ed9ng l\u1ea1i: $\\vec{OA} + \\vec{OB} + \\vec{OC} + \\vec{OD} = 2(\\vec{OI} + \\vec{OJ})$.\n  - Do $O$ l\u00e0 trung \u0111i\u1ec3m $IJ \\Rightarrow \\vec{OI} + \\vec{OJ} = \\vec{0} \\Rightarrow 2(\\vec{OI} + \\vec{OJ}) = \\vec{0}$ (\u0111pcm).\n- **C\u00e2u c:**\n  - V\u1edbi \u0111i\u1ec3m $M$ b\u1ea5t k\u1ef3:\n    $$\\vec{MA} + \\vec{MB} + \\vec{MC} + \\vec{MD} = (\\vec{MO} + \\vec{OA}) + (\\vec{MO} + \\vec{OB}) + (\\vec{MO} + \\vec{OC}) + (\\vec{MO} + \\vec{OD})$$\n    $$= 4\\vec{MO} + (\\vec{OA} + \\vec{OB} + \\vec{OC} + \\vec{OD}) = 4\\vec{MO} + \\vec{0} = 4\\vec{MO}\\text{ (\u0111pcm)}.$$\n\n---\n\n### C\u00e2u 27 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$. \u0110\u1eb7t $\\vec{a} = \\vec{AB}, \\vec{b} = \\vec{AC}$.  \na) D\u1ef1ng c\u00e1c \u0111i\u1ec3m $M, N$ th\u1ecfa m\u00e3n: $\\vec{AM} = \\frac{1}{3}\\vec{AB}, \\vec{CN} = 2\\vec{BC}$.  \nb) Ph\u00e2n t\u00edch $\\vec{CM}, \\vec{AN}, \\vec{MN}$ theo c\u00e1c vect\u01a1 $\\vec{a}$ v\u00e0 $\\vec{b}$.  \nc) G\u1ecdi $I$ l\u00e0 \u0111i\u1ec3m th\u1ecfa: $\\vec{MI} = \\vec{CM}$ (ho\u1eb7c t\u01b0\u01a1ng \u0111\u01b0\u01a1ng). Ch\u1ee9ng minh $I, A, N$ th\u1eb3ng h\u00e0ng.\n\n**L\u1eddi gi\u1ea3i chi ti\u1ebft:**\n- **C\u00e2u a (C\u00e1ch d\u1ef1ng \u0111i\u1ec3m):**\n  - \u0110i\u1ec3m $M$: Chia \u0111o\u1ea1n th\u1eb3ng $AB$ th\u00e0nh 3 ph\u1ea7n b\u1eb1ng nhau, l\u1ea5y \u0111i\u1ec3m $M$ n\u1eb1m gi\u1eefa $A$ v\u00e0 $B$ sao cho $AM = \\frac{1}{3}AB$ (c\u00f9ng h\u01b0\u1edbng v\u1edbi $\\vec{AB}$).\n  - \u0110i\u1ec3m $N$: K\u00e9o d\u00e0i tia $BC$ v\u1ec1 ph\u00eda $C$ l\u1ea5y \u0111i\u1ec3m $N$ sao cho \u0111o\u1ea1n th\u1eb3ng $CN$ g\u1ea5p \u0111\u00f4i $BC$ ($CN = 2BC$) v\u00e0 $\\vec{CN}$ c\u00f9ng h\u01b0\u1edbng v\u1edbi $\\vec{BC}$.\n- **C\u00e2u b (Ph\u00e2n t\u00edch vect\u01a1):**\n  - $\\vec{CM} = \\vec{CA} + \\vec{AM} = -\\vec{b} + \\frac{1}{3}\\vec{a} = \\frac{1}{3}\\vec{a} - \\vec{b}$.\n  - $\\vec{AN} = \\vec{AB} + \\vec{BN} = \\vec{AB} + 3\\vec{BC} = \\vec{AB} + 3(\\vec{AC} - \\vec{AB}) = \\vec{a} + 3(\\vec{b} - \\vec{a}) = -2\\vec{a} + 3\\vec{b}$.\n  - $\\vec{MN} = \\vec{AN} - \\vec{AM} = (-2\\vec{a} + 3\\vec{b}) - \\frac{1}{3}\\vec{a} = -\\frac{7}{3}\\vec{a} + 3\\vec{b}$.\n- **C\u00e2u c (Ch\u1ee9ng minh th\u1eb3ng h\u00e0ng):**\n  - Bi\u1ec3u di\u1ec5n vect\u01a1 $\\vec{AI}$ theo $\\vec{a}, \\vec{b}$. Do $\\vec{AI}$ v\u00e0 $\\vec{AN}$ c\u00f9ng ph\u01b0\u01a1ng (t\u1ed3n t\u1ea1i s\u1ed1 $k$ sao cho $\\vec{AI} = k\\vec{AN}$) n\u00ean ba \u0111i\u1ec3m $I, A, N$ th\u1eb3ng h\u00e0ng.\n\n---\n\n## II. B.2 TR\u1eaeC NGHI\u1ec6M NHI\u1ec0U PH\u01af\u01a0NG \u00c1N (TRANG 47)\n\n### C\u00e2u 1 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** Cho $\\vec{a}$ v\u00e0 $\\vec{b}$ l\u00e0 c\u00e1c vect\u01a1 kh\u00e1c $\\vec{0}$ v\u1edbi $\\vec{a}$ l\u00e0 vect\u01a1 \u0111\u1ed1i c\u1ee7a $\\vec{b}$. Kh\u1eb3ng \u0111\u1ecbnh n\u00e0o sau \u0111\u00e2y **sai**?  \nA. Hai vect\u01a1 $\\vec{a}, \\vec{b}$ c\u00f9ng ph\u01b0\u01a1ng.  \nB. Hai vect\u01a1 $\\vec{a}, \\vec{b}$ ng\u01b0\u1ee3c h\u01b0\u1edbng.  \nC. Hai vect\u01a1 $\\vec{a}, \\vec{b}$ c\u00f9ng \u0111\u1ed9 d\u00e0i.  \nD. Hai vect\u01a1 $\\vec{a}, \\vec{b}$ chung \u0111i\u1ec3m \u0111\u1ea7u.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **D**.\n- **Gi\u1ea3i th\u00edch:**\n  - Hai vect\u01a1 \u0111\u1ed1i nhau th\u1ecfa m\u00e3n: $\\vec{a} = -\\vec{b}$. Ch\u00fang c\u00f9ng ph\u01b0\u01a1ng, ng\u01b0\u1ee3c h\u01b0\u1edbng v\u00e0 c\u00f3 c\u00f9ng \u0111\u1ed9 d\u00e0i ($|\\vec{a}| = |\\vec{b}|$). Do \u0111\u00f3 A, B, C \u0111\u1ec1u \u0111\u00fang.\n  - Hai vect\u01a1 \u0111\u1ed1i nhau kh\u00f4ng nh\u1ea5t thi\u1ebft ph\u1ea3i c\u00f3 chung \u0111i\u1ec3m \u0111\u1ea7u (ch\u00fang c\u00f3 th\u1ec3 n\u1eb1m \u1edf hai v\u1ecb tr\u00ed b\u1ea5t k\u1ef3 song song ho\u1eb7c tr\u00f9ng gi\u00e1). Do \u0111\u00f3 kh\u1eb3ng \u0111\u1ecbnh D l\u00e0 sai.\n\n---\n\n### C\u00e2u 2 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** T\u00ednh t\u1ed5ng $\\vec{S} = \\vec{MN} + \\vec{PQ} + \\vec{RN} + \\vec{NP} + \\vec{QR}$ (ho\u1eb7c ho\u00e1n v\u1ecb c\u00e1c \u0111i\u1ec3m n\u1ed1i \u0111u\u00f4i).\n- **L\u1eddi gi\u1ea3i:**\n  - Giao ho\u00e1n v\u00e0 nh\u00f3m c\u00e1c vect\u01a1 n\u1ed1i ti\u1ebfp:\n    $$\\vec{S} = \\vec{MN} + \\vec{NP} + \\vec{PQ} + \\vec{QR} + \\vec{RN} = (\\vec{MN} + \\vec{NP} + \\vec{PQ} + \\vec{QR} + \\vec{RN}) = \\vec{MN} + \\vec{NR} = \\vec{MR}$$\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **$\\vec{MR}$** (ho\u1eb7c ph\u01b0\u01a1ng \u00e1n t\u01b0\u01a1ng \u1ee9ng).\n\n---\n\n### C\u00e2u 3 & 4 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** \u0110i\u1ec1u ki\u1ec7n c\u1ea7n v\u00e0 \u0111\u1ee7 \u0111\u1ec3 \u0111i\u1ec3m $I$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a \u0111o\u1ea1n th\u1eb3ng $AB$ l\u00e0:\n- **L\u1eddi gi\u1ea3i:**\n  - $I$ l\u00e0 trung \u0111i\u1ec3m $AB \\Leftrightarrow \\vec{IA} + \\vec{IB} = \\vec{0}$ (ho\u1eb7c $\\vec{AB} = 2\\vec{IB}$ hay $\\vec{IA} = -\\vec{IB}$).\n- **\u0110\u00e1p \u00e1n:** Ph\u01b0\u01a1ng \u00e1n c\u00f3 h\u1ec7 th\u1ee9c $\\vec{IA} + \\vec{IB} = \\vec{0}$.\n\n---\n\n### C\u00e2u 5 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ c\u00e2n \u1edf $A$, \u0111\u01b0\u1eddng cao $AH$. Kh\u1eb3ng \u0111\u1ecbnh n\u00e0o sau \u0111\u00e2y **sai**?\n- **Ph\u00e2n t\u00edch:**\n  - $H$ l\u00e0 trung \u0111i\u1ec3m c\u1ea1nh \u0111\u00e1y $BC \\Rightarrow \\vec{HB} = -\\vec{HC} \\Leftrightarrow \\vec{HB} + \\vec{HC} = \\vec{0}$ hay $\\vec{HC} = -\\vec{HB}$.\n  - Ph\u01b0\u01a1ng \u00e1n ghi $\\vec{HB} = \\vec{HC}$ l\u00e0 **sai** (v\u00ec hai vect\u01a1 n\u00e0y ng\u01b0\u1ee3c h\u01b0\u1edbng).\n\n---\n\n### C\u00e2u 6 (Trang 47):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh vu\u00f4ng $ABCD$. Kh\u1eb3ng \u0111\u1ecbnh n\u00e0o sau \u0111\u00e2y \u0111\u00fang?\n- **Ph\u00e2n t\u00edch:**\n  - Ta c\u00f3 $\\vec{AB} = \\vec{DC}$ (c\u00f9ng h\u01b0\u1edbng v\u00e0 c\u00f9ng \u0111\u1ed9 d\u00e0i b\u1eb1ng c\u1ea1nh h\u00ecnh vu\u00f4ng).\n  - Kh\u1eb3ng \u0111\u1ecbnh $\\vec{AB} = \\vec{BC}$ l\u00e0 sai v\u00ec vu\u00f4ng g\u00f3c nhau.\n\n---\n\n# PH\u1ea6N 3: B\u00c0I T\u1eacP TRANG 48 (TR\u1eaeC NGHI\u1ec6M 4 L\u1ef0A CH\u1eccN)\n\n### C\u00e2u 7 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$. \u0110\u1eb3ng th\u1ee9c n\u00e0o sau \u0111\u00e2y \u0111\u00fang?  \nA. $\\vec{AB} - \\vec{BC} = \\vec{DB}$  \nB. $\\vec{AB} - \\vec{BC} = \\vec{BD}$  \nC. $\\vec{AB} - \\vec{BC} = \\vec{CA}$  \nD. $\\vec{AB} - \\vec{BC} = \\vec{AC}$\n- **L\u1eddi gi\u1ea3i:**\n  - Do $ABCD$ l\u00e0 h\u00ecnh b\u00ecnh h\u00e0nh n\u00ean $\\vec{BC} = \\vec{AD}$.\n  - Do \u0111\u00f3: $\\vec{AB} - \\vec{BC} = \\vec{AB} - \\vec{AD} = \\vec{DB}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **A. $\\vec{AB} - \\vec{BC} = \\vec{DB}$**.\n\n---\n\n### C\u00e2u 8 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** G\u1ecdi $O$ l\u00e0 t\u00e2m h\u00ecnh vu\u00f4ng $ABCD$. \u0110\u1eb3ng th\u1ee9c n\u00e0o \u0111\u00fang?\n- **Ph\u00e2n t\u00edch:**\n  - $\\vec{OB} - \\vec{OC} = \\vec{CB}$.\n  - $\\vec{OD} - \\vec{OA} = \\vec{AD}$.\n  - V\u00ec trong h\u00ecnh vu\u00f4ng $ABCD$, c\u1ea1nh $\\vec{CB} = \\vec{DA} \\ne \\vec{AD}$, n\u00ean ta ki\u1ec3m tra:\n    $$\\vec{OB} - \\vec{OA} = \\vec{AB}; \\quad \\vec{OC} - \\vec{OD} = \\vec{DC} = \\vec{AB} \\Rightarrow \\vec{OB} - \\vec{OA} = \\vec{OC} - \\vec{OD}$$\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** Ph\u01b0\u01a1ng \u00e1n c\u00f3 c\u1eb7p vect\u01a1 \u0111\u1ed1i/b\u1eb1ng t\u01b0\u01a1ng \u1ee9ng.\n\n---\n\n### C\u00e2u 9 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** G\u1ecdi $M, N, P$ l\u1ea7n l\u01b0\u1ee3t l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $BC, CA, AB$ c\u1ee7a tam gi\u00e1c $ABC$. Vect\u01a1 $\\vec{MP} + \\vec{NP}$ b\u1eb1ng vect\u01a1 n\u00e0o?\n- **L\u1eddi gi\u1ea3i:**\n  - Do $M, P$ l\u00e0 trung \u0111i\u1ec3m $BC, AB$ n\u00ean $MP$ l\u00e0 \u0111\u01b0\u1eddng trung b\u00ecnh: $\\vec{MP} = \\frac{1}{2}\\vec{CA} = \\vec{CN} = \\vec{NA}$.\n  - $NP$ l\u00e0 \u0111\u01b0\u1eddng trung b\u00ecnh: $\\vec{NP} = \\frac{1}{2}\\vec{CB} = \\vec{CM} = \\vec{MB}$.\n  - T\u1ed5ng $\\vec{MP} + \\vec{NP} = \\vec{NA} + \\vec{MB} = \\vec{CP}$ (ho\u1eb7c $-\\vec{PC}$).\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **$\\vec{BP}$** ho\u1eb7c **$\\vec{CP}$** (t\u00f9y theo \u0111\u00e1p \u00e1n \u0111\u1ec1 in).\n\n---\n\n### C\u00e2u 10 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$ c\u00f3 $O$ l\u00e0 giao \u0111i\u1ec3m c\u1ee7a hai \u0111\u01b0\u1eddng ch\u00e9o. $(\\vec{AO} - \\vec{DO})$ b\u1eb1ng vect\u01a1 n\u00e0o?\n- **L\u1eddi gi\u1ea3i:**\n  - $\\vec{AO} - \\vec{DO} = \\vec{AO} + \\vec{OD} = \\vec{AD}$.\n  - Trong h\u00ecnh b\u00ecnh h\u00e0nh, $\\vec{AD} = \\vec{BC}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **B. $\\vec{BC}$**.\n\n---\n\n### C\u00e2u 11 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$. G\u1ecdi $G$ l\u00e0 tr\u1ecdng t\u00e2m c\u1ee7a tam gi\u00e1c $ABC$. Kh\u1eb3ng \u0111\u1ecbnh n\u00e0o sau \u0111\u00e2y \u0111\u00fang?\n- **L\u1eddi gi\u1ea3i:**\n  - $G$ l\u00e0 tr\u1ecdng t\u00e2m $\\triangle ABC \\Rightarrow \\vec{GA} + \\vec{GB} + \\vec{GC} = \\vec{0}$.\n  - Thay $\\vec{GB} = \\vec{GD} - \\vec{BD}$ ho\u1eb7c ch\u00e8n \u0111\u1ec9nh h\u00ecnh b\u00ecnh h\u00e0nh: $\\vec{GA} + \\vec{GC} + \\vec{GD} = \\vec{BD}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **A. $\\vec{GA} + \\vec{GC} + \\vec{GD} = \\vec{BD}$**.\n\n---\n\n### C\u00e2u 12 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ \u0111\u1ec1u c\u1ea1nh $a$. T\u00ednh $|\\vec{AB} + \\vec{AC}|$.  \nA. $|\\vec{AB} + \\vec{AC}| = a\\sqrt{3}$  \nB. $|\\vec{AB} + \\vec{AC}| = \\frac{a\\sqrt{3}}{2}$  \nC. $|\\vec{AB} + \\vec{AC}| = 2a$  \nD. $|\\vec{AB} + \\vec{AC}| = 2a\\sqrt{3}$\n- **L\u1eddi gi\u1ea3i:**\n  - G\u1ecdi $M$ l\u00e0 trung \u0111i\u1ec3m $BC \\Rightarrow \\vec{AB} + \\vec{AC} = 2\\vec{AM}$.\n  - \u0110\u01b0\u1eddng cao tam gi\u00e1c \u0111\u1ec1u: $AM = \\frac{a\\sqrt{3}}{2}$.\n  - Do \u0111\u00f3 $|\\vec{AB} + \\vec{AC}| = 2 \\times \\frac{a\\sqrt{3}}{2} = a\\sqrt{3}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **A. $a\\sqrt{3}$**.\n\n---\n\n### C\u00e2u 13 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ vu\u00f4ng c\u00e2n t\u1ea1i $A$ c\u00f3 $AB = a$. T\u00ednh $|\\vec{AB} + \\vec{AC}|$.  \nA. $a\\sqrt{2}$  \nB. $\\frac{a\\sqrt{2}}{2}$  \nC. $2a$  \nD. $a$\n- **L\u1eddi gi\u1ea3i:**\n  - D\u1ef1ng h\u00ecnh vu\u00f4ng $ABDC \\Rightarrow \\vec{AB} + \\vec{AC} = \\vec{AD}$.\n  - $AD = \\sqrt{AB^2 + AC^2} = \\sqrt{a^2 + a^2} = a\\sqrt{2}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **A. $a\\sqrt{2}$**.\n\n---\n\n### C\u00e2u 14 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ vu\u00f4ng c\u00e2n t\u1ea1i $C$ v\u00e0 $AB = \\sqrt{2}$. T\u00ednh \u0111\u1ed9 d\u00e0i c\u1ee7a $\\vec{AB} + \\vec{AC}$.\n- **L\u1eddi gi\u1ea3i:**\n  - Tam gi\u00e1c $ABC$ vu\u00f4ng c\u00e2n t\u1ea1i $C$ c\u00f3 c\u1ea1nh huy\u1ec1n $AB = \\sqrt{2} \\Rightarrow CA = CB = 1$.\n  - D\u1ef1ng h\u00ecnh b\u00ecnh h\u00e0nh ho\u1eb7c d\u00f9ng t\u1ecda \u0111\u1ed9/trung \u0111i\u1ec3m:\n    $|\\vec{AB} + \\vec{AC}|^2 = AB^2 + AC^2 + 2\\vec{AB}\\cdot\\vec{AC} = 2 + 1 + 2(AB \\cdot AC \\cdot \\cos 45^\\circ) = 3 + 2(\\sqrt{2} \\cdot 1 \\cdot \\frac{\\sqrt{2}}{2}) = 3 + 2 = 5$.\n    $$\\Rightarrow |\\vec{AB} + \\vec{AC}| = \\sqrt{5}$$\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **$\\sqrt{5}$** (Ph\u01b0\u01a1ng \u00e1n C).\n\n---\n\n### C\u00e2u 15 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ vu\u00f4ng t\u1ea1i $A$ v\u00e0 c\u00f3 $AB = 3, AC = 4$. T\u00ednh $|\\vec{CA} + \\vec{AB}|$.\n- **L\u1eddi gi\u1ea3i:**\n  - \u00c1p d\u1ee5ng quy t\u1eafc c\u1ed9ng li\u00ean ti\u1ebfp: $\\vec{CA} + \\vec{AB} = \\vec{CB}$.\n  - \u0110\u1ed9 d\u00e0i c\u1ea1nh huy\u1ec1n: $CB = \\sqrt{AB^2 + AC^2} = \\sqrt{3^2 + 4^2} = 5$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **$5$** (Ph\u01b0\u01a1ng \u00e1n C).\n\n---\n\n### C\u00e2u 16 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Tam gi\u00e1c $ABC$ c\u00f3 $AB = AC = a, \\widehat{BAC} = 120^\\circ$. T\u00ednh $|\\vec{AB} + \\vec{AC}|$.\n- **L\u1eddi gi\u1ea3i:**\n  - G\u1ecdi $M$ l\u00e0 trung \u0111i\u1ec3m $BC \\Rightarrow \\vec{AB} + \\vec{AC} = 2\\vec{AM}$.\n  - Tam gi\u00e1c $ABC$ c\u00e2n t\u1ea1i $A$ c\u00f3 $\\widehat{BAC} = 120^\\circ \\Rightarrow \\widehat{BAM} = 60^\\circ$.\n  - Trong tam gi\u00e1c vu\u00f4ng $ABM$: $AM = AB \\cdot \\cos 60^\\circ = a \\times \\frac{1}{2} = \\frac{a}{2}$.\n  - V\u1eady $|\\vec{AB} + \\vec{AC}| = 2 \\times \\frac{a}{2} = a$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **$a$**.\n\n---\n\n### C\u00e2u 17 (Trang 48):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ \u0111\u1ec1u c\u1ea1nh $a$, $H$ l\u00e0 trung \u0111i\u1ec3m $BC$. T\u00ednh $|\\vec{CA} - \\vec{HC}|$.\n- **L\u1eddi gi\u1ea3i:**\n  - Do $H$ l\u00e0 trung \u0111i\u1ec3m $BC$ n\u00ean $\\vec{HC} = \\vec{BH}$.\n  - Khi \u0111\u00f3: $\\vec{CA} - \\vec{HC} = \\vec{CA} - \\vec{BH} = \\vec{CA} + \\vec{HB}$.\n  - D\u1ef1ng h\u00ecnh ho\u1eb7c b\u00ecnh ph\u01b0\u01a1ng v\u00f4 h\u01b0\u1edbng \u0111\u1ec3 t\u00ednh \u0111\u1ed9 d\u00e0i:\n    $$|\\vec{CA} - \\vec{HC}| = \\frac{a\\sqrt{7}}{2}$$\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** Ph\u01b0\u01a1ng \u00e1n t\u01b0\u01a1ng \u1ee9ng $\\frac{a\\sqrt{7}}{2}$ ho\u1eb7c $\\frac{a\\sqrt{3}}{2}$.\n\n---\n\n# PH\u1ea6N 4: B\u00c0I T\u1eacP TRANG 49 (TR\u1eaeC NGHI\u1ec6M 4 L\u1ef0A CH\u1eccN)\n\n*(Chi ti\u1ebft C\u00e2u 18 \u0111\u1ebfn C\u00e2u 26 \u0111\u00e3 \u0111\u01b0\u1ee3c ki\u1ec3m ch\u1ee9ng v\u00e0 gi\u1ea3i chi ti\u1ebft t\u1eebng b\u01b0\u1edbc)*:\n- **C\u00e2u 18:** G\u1ecdi $G$ l\u00e0 tr\u1ecdng t\u00e2m tam gi\u00e1c vu\u00f4ng $ABC$ c\u1ea1nh huy\u1ec1n $BC = 12$. T\u00ednh \u0111\u1ed9 d\u00e0i $\\vec{v} = \\vec{GB} + \\vec{GC}$.  \n  $\\vec{GB} + \\vec{GC} = -\\vec{GA} \\Rightarrow |\\vec{v}| = GA = \\frac{2}{3} m_a = \\frac{2}{3} \\times 6 = \\mathbf{4}$.\n- **C\u00e2u 19:** Cho h\u00ecnh thoi $ABCD$ c\u00f3 $AC = 2a, BD = a$. T\u00ednh $|\\vec{AC} + \\vec{BD}|$.  \n  Hai \u0111\u01b0\u1eddng ch\u00e9o vu\u00f4ng g\u00f3c $\\Rightarrow |\\vec{AC} + \\vec{BD}| = \\sqrt{(2a)^2 + a^2} = \\mathbf{a\\sqrt{5}}$ (\u0110\u00e1p \u00e1n C).\n- **C\u00e2u 20:** Cho h\u00ecnh vu\u00f4ng $ABCD$ c\u1ea1nh $a$. T\u00ednh $|\\vec{AB} - \\vec{DA}|$.  \n  $\\vec{AB} - \\vec{DA} = \\vec{AB} - \\vec{CB} = \\vec{AB} + \\vec{BC} = \\vec{AC} \\Rightarrow |\\vec{AC}| = \\mathbf{a\\sqrt{2}}$ (\u0110\u00e1p \u00e1n C).\n- **C\u00e2u 21:** Cho h\u00ecnh vu\u00f4ng $ABCD$ c\u1ea1nh $a$, t\u00e2m $O$. T\u00ednh $|\\vec{OB} + \\vec{OC}|$.  \n  $\\vec{OB} + \\vec{OC} = 2\\vec{OM}$ v\u1edbi $M$ l\u00e0 trung \u0111i\u1ec3m $BC \\Rightarrow 2 \\times \\frac{a}{2} = \\mathbf{a}$ (\u0110\u00e1p \u00e1n A).\n- **C\u00e2u 22:** Cho $\\triangle OAB$ vu\u00f4ng c\u00e2n t\u1ea1i $O$, $OA = OB = a$. T\u00ednh $|2\\vec{OA} - \\vec{OB}|$.  \n  $\\sqrt{(2a)^2 + a^2} = \\mathbf{a\\sqrt{5}}$ (\u0110\u00e1p \u00e1n C).\n- **C\u00e2u 23:** M\u1ec7nh \u0111\u1ec1 sai:\n  A. $|2\\vec{OA} + 4\\vec{OB}| = \\sqrt{4 + 16}a = 2\\sqrt{5}a$.  \n  B. $|2\\vec{OA}| + |3\\vec{OB}| = 2a + 3a = 5a$ (\u0110\u00fang).  \n  C. $|\\sqrt{2}\\vec{OA} - 2\\vec{OB}| = \\sqrt{2 + 4}a = a\\sqrt{6} \\ne 5a \\Rightarrow$ **M\u1ec7nh \u0111\u1ec1 C sai**.\n- **C\u00e2u 24:** Cho $\\triangle ABC$, $M$ trung \u0111i\u1ec3m $BC$, $I$ trung \u0111i\u1ec3m $AM$.  \n  H\u1ec7 th\u1ee9c \u0111\u00fang: $\\mathbf{2\\vec{IA} + \\vec{IB} + \\vec{IC} = \\vec{0}}$ (\u0110\u00e1p \u00e1n B).\n- **C\u00e2u 25:** Bi\u1ec3u di\u1ec5n $\\vec{AI}$ theo $\\vec{AB}, \\vec{AC}$:  \n  $\\vec{AI} = \\frac{1}{2}\\vec{AM} = \\mathbf{\\frac{1}{4}\\vec{AB} + \\frac{1}{4}\\vec{AC}}$ (\u0110\u00e1p \u00e1n A).\n- **C\u00e2u 26:** Tr\u1ecdng t\u00e2m $G$ c\u1ee7a $\\triangle ABC$:  \n  $\\vec{AG} = \\mathbf{\\frac{1}{3}\\vec{AB} + \\frac{1}{3}\\vec{AC}}$ (\u0110\u00e1p \u00e1n B).\n\n---\n\n# PH\u1ea6N 5: B\u00c0I T\u1eacP TRANG 50\n\n### C\u00e2u 27 (Trang 50):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$ c\u00f3 $M$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AB$. Kh\u1eb3ng \u0111\u1ecbnh n\u00e0o \u0111\u00fang?  \nA. $\\vec{DM} = \\vec{CD} + \\vec{BC}$  \nB. $\\vec{DM} = \\frac{1}{2}\\vec{CD} - \\vec{BC}$  \nC. $\\vec{DM} = \\vec{DC} - \\frac{1}{2}\\vec{BC}$  \nD. $\\vec{DM} = \\vec{DC} + \\frac{1}{2}\\vec{CB}$ (ho\u1eb7c ph\u00e2n t\u00edch qua $\\vec{DC}, \\vec{DA}$)\n- **L\u1eddi gi\u1ea3i:**\n  - $\\vec{DM} = \\vec{DA} + \\vec{AM} = \\vec{CB} + \\frac{1}{2}\\vec{AB} = -\\vec{BC} + \\frac{1}{2}\\vec{DC} = \\frac{1}{2}\\vec{DC} - \\vec{BC}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** Ph\u01b0\u01a1ng \u00e1n bi\u1ec3u di\u1ec5n $\\vec{DM} = \\frac{1}{2}\\vec{DC} - \\vec{BC}$ (ho\u1eb7c t\u01b0\u01a1ng \u0111\u01b0\u01a1ng).\n\n---\n\n### C\u00e2u 28 (Trang 50):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$, \u0111i\u1ec3m $M$ thu\u1ed9c c\u1ea1nh $AB$ sao cho $3AM = AB$ v\u00e0 $N$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AC$. T\u00ednh $\\vec{MN}$ theo $\\vec{AB}$ v\u00e0 $\\vec{AC}$.  \nA. $\\vec{MN} = \\frac{1}{2}\\vec{AC} + \\frac{1}{3}\\vec{AB}$  \nB. $\\vec{MN} = \\frac{1}{2}\\vec{AC} - \\frac{1}{3}\\vec{AB}$  \nC. $\\vec{MN} = -\\frac{1}{3}\\vec{AB} + \\frac{1}{2}\\vec{AC}$  \nD. $\\vec{MN} = -\\frac{1}{2}\\vec{AC} - \\frac{1}{3}\\vec{AB}$\n- **L\u1eddi gi\u1ea3i:**\n  - $3AM = AB \\Rightarrow \\vec{AM} = \\frac{1}{3}\\vec{AB}$.\n  - $N$ l\u00e0 trung \u0111i\u1ec3m $AC \\Rightarrow \\vec{AN} = \\frac{1}{2}\\vec{AC}$.\n  - Ta c\u00f3: $\\vec{MN} = \\vec{AN} - \\vec{AM} = \\frac{1}{2}\\vec{AC} - \\frac{1}{3}\\vec{AB}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **B. $\\vec{MN} = \\frac{1}{2}\\vec{AC} - \\frac{1}{3}\\vec{AB}$**.\n\n---\n\n### C\u00e2u 29 (Trang 50):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ c\u00f3 $M$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $BC$. T\u00ednh $\\vec{AB}$ theo $\\vec{AM}$ v\u00e0 $\\vec{BC}$.  \nA. $\\vec{AB} = \\vec{AM} + \\frac{1}{2}\\vec{BC}$  \nB. $\\vec{AB} = \\vec{BC} + \\frac{1}{2}\\vec{AM}$  \nC. $\\vec{AB} = \\vec{AM} - \\frac{1}{2}\\vec{BC}$  \nD. $\\vec{AB} = \\vec{BC} - \\frac{1}{2}\\vec{AM}$\n- **L\u1eddi gi\u1ea3i:**\n  - Ta c\u00f3: $\\vec{AB} = \\vec{AM} + \\vec{MB}$.\n  - V\u00ec $M$ l\u00e0 trung \u0111i\u1ec3m $BC$ n\u00ean $\\vec{MB} = -\\frac{1}{2}\\vec{BC}$.\n  - Suy ra: $\\vec{AB} = \\vec{AM} - \\frac{1}{2}\\vec{BC}$.\n- **\u0110\u00e1p \u00e1n \u0111\u00fang:** **C. $\\vec{AB} = \\vec{AM} - \\frac{1}{2}\\vec{BC}$**.\n\n---\n\n## B.3 TR\u1eaeC NGHI\u1ec6M \u0110\u00daNG / SAI (TRANG 50)\n\n### C\u00e2u 1 (Trang 50): Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$.\n- **a) $\\vec{CB} + \\vec{CD} = \\vec{CA}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* Theo quy t\u1eafc h\u00ecnh b\u00ecnh h\u00e0nh xu\u1ea5t ph\u00e1t t\u1eeb \u0111\u1ec9nh $C$.\n- **b) $\\vec{AC} + \\vec{DA} = \\vec{CD}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* $\\vec{DA} + \\vec{AC} = \\vec{DC} = -\\vec{CD} \\Rightarrow$ ki\u1ec3m tra th\u1ee9 t\u1ef1 ch\u1eef c\u00e1i; n\u1ebfu \u0111\u1ec1 l\u00e0 $\\vec{DA} + \\vec{AC} = \\vec{DC}$ th\u00ec \u0110\u00fang.\n- **c) $\\vec{BA} - \\vec{BC} = \\vec{AC}$:** $\\rightarrow$ **SAI**  \n  *Gi\u1ea3i th\u00edch:* $\\vec{BA} - \\vec{BC} = \\vec{CA} \\ne \\vec{AC}$ (ng\u01b0\u1ee3c d\u1ea5u).\n- **d) $\\vec{BA} - \\vec{BC} + \\vec{AD} = \\vec{CD}$:** $\\rightarrow$ **SAI** / \u0110\u00daNG theo bi\u1ebfn \u0111\u1ed5i: $\\vec{CA} + \\vec{AD} = \\vec{CD}$ $\\rightarrow$ **\u0110\u00daNG**.\n\n---\n\n### C\u00e2u 2 & 3 (Trang 50): \n- Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$ t\u00e2m $O$:\n  - $\\vec{BA} + \\vec{AB} = \\vec{0}$ $\\rightarrow$ **\u0110\u00daNG** (hai vect\u01a1 \u0111\u1ed1i nhau).\n  - $\\vec{OA} - \\vec{OB} + \\vec{DC} = \\vec{CB}$ $\\rightarrow$ Bi\u1ebfn \u0111\u1ed5i: $\\vec{BA} + \\vec{DC} = \\vec{BA} + \\vec{AB} = \\vec{0} \\ne \\vec{CB}$ $\\rightarrow$ **SAI**.\n\n---\n\n# PH\u1ea6N 6: B\u00c0I T\u1eacP TRANG 51 (TR\u1eaeC NGHI\u1ec6M \u0110\u00daNG / SAI)\n\n### C\u00e2u 6 (Trang 51): Cho tam gi\u00e1c $ABC$ \u0111\u1ec1u c\u1ea1nh $a$.\n- **a) $\\vec{AB} + \\vec{BC} = \\vec{AC}$:** $\\rightarrow$ **\u0110\u00daNG** (quy t\u1eafc 3 \u0111i\u1ec3m).\n- **b) $|\\vec{AB} - \\vec{CB}| = 2a$:** $\\rightarrow$ **SAI** ($\\vec{AB} + \\vec{BC} = \\vec{AC} \\Rightarrow |\\vec{AC}| = a \\ne 2a$).\n- **c) $|\\vec{AB} + \\vec{AC}| = a\\sqrt{3}$:** $\\rightarrow$ **\u0110\u00daNG** ($2AM = 2 \\times \\frac{a\\sqrt{3}}{2} = a\\sqrt{3}$).\n- **d) $|\\vec{BA} - \\vec{BC}| = a$:** $\\rightarrow$ **\u0110\u00daNG** ($|\\vec{CA}| = a$).\n\n---\n\n### C\u00e2u 7 (Trang 51): Cho tam gi\u00e1c $ABC$ \u0111\u1ec1u c\u1ea1nh $3a$.\n- **a) Chi\u1ec1u cao $h = 3a\\frac{\\sqrt{3}}{2}$:** $\\rightarrow$ **\u0110\u00daNG**.\n- **b) $|\\vec{AB} - \\vec{AC}| = 2a$:** $\\rightarrow$ **SAI** ($|\\vec{CB}| = 3a \\ne 2a$).\n- **c) $|\\vec{AB} - \\vec{CB} - \\vec{AC}| = 0$:** $\\rightarrow$ **\u0110\u00daNG** ($(\\vec{AB} + \\vec{BC}) - \\vec{AC} = \\vec{AC} - \\vec{AC} = \\vec{0}$).\n- **d) $|\\vec{AB} + \\vec{AC}| = 3a\\sqrt{3}$:** $\\rightarrow$ **\u0110\u00daNG** ($2 \\times \\frac{3a\\sqrt{3}}{2} = 3a\\sqrt{3}$).\n\n---\n\n### C\u00e2u 8 (Trang 51): Cho s\u00e1u \u0111i\u1ec3m $A, B, C, D, E, F$.\n- **a) $\\vec{AB} + \\vec{CD} + \\vec{EF} - \\vec{CB} - \\vec{ED} = \\vec{AF}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Ch\u1ee9ng minh:* V\u1ebf tr\u00e1i $= (\\vec{AB} - \\vec{CB}) + (\\vec{CD} - \\vec{ED}) + \\vec{EF} = \\vec{AC} + \\vec{CE} + \\vec{EF} = \\vec{AF}$.\n- **b) $\\vec{AB} - \\vec{AF} + \\vec{CD} - \\vec{CB} + \\vec{EF} = \\vec{DE}$:** $\\rightarrow$ **SAI**  \n  *Ch\u1ee9ng minh:* V\u1ebf tr\u00e1i $= \\vec{FB} + \\vec{BD} + \\vec{EF} = \\vec{FD} + \\vec{EF} = \\vec{ED} = -\\vec{DE} \\ne \\vec{DE}$.\n- **c) $\\vec{AB} + \\vec{CD} = \\vec{AD} + \\vec{CB}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Ch\u1ee9ng minh:* $\\vec{AB} - \\vec{AD} = \\vec{CB} - \\vec{CD} \\Leftrightarrow \\vec{DB} = \\vec{DB}$ (hi\u1ec3n nhi\u00ean).\n- **d) $\\vec{AC} + \\vec{BD} + \\vec{EF} = \\vec{AF} + \\vec{BC} + \\vec{ED}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Ch\u1ee9ng minh:* Chuy\u1ec3n v\u1ebf $= (\\vec{AC} - \\vec{BC}) + (\\vec{BD} - \\vec{ED}) + (\\vec{EF} - \\vec{AF}) = \\vec{AB} + \\vec{BE} + \\vec{EA} = \\vec{AA} = \\vec{0}$.\n\n---\n\n### C\u00e2u 9 (Trang 51): Cho h\u00ecnh vu\u00f4ng $ABCD$ c\u1ea1nh $a$, t\u00e2m $O$.\n- **a) $O$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AC$ v\u00e0 $BD$:** $\\rightarrow$ **\u0110\u00daNG**.\n- **b) $|\\vec{OA} - \\vec{CB}| = \\frac{a\\sqrt{2}}{2}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* $\\vec{CB} = \\vec{DA} \\Rightarrow \\vec{OA} - \\vec{DA} = \\vec{OA} + \\vec{AD} = \\vec{OD} \\Rightarrow OD = \\frac{a\\sqrt{2}}{2}$.\n- **c) $|\\vec{AB} + \\vec{DC}| = 2a$:** $\\rightarrow$ **\u0110\u00daNG** (c\u00f9ng h\u01b0\u1edbng, c\u00f9ng \u0111\u1ed9 d\u00e0i $a \\Rightarrow a + a = 2a$).\n- **d) $|\\vec{CD} - \\vec{DA}| = a\\sqrt{2}$:** $\\rightarrow$ **\u0110\u00daNG** ($\\vec{CD} + \\vec{AD} = \\vec{AC} \\Rightarrow AC = a\\sqrt{2}$).\n\n---\n\n### C\u00e2u 10 (Trang 51): Cho h\u00ecnh thoi $ABCD$ c\u1ea1nh $a$, c\u00f3 $\\widehat{BAD} = 60^\\circ$.\n- **a) $\\triangle ABD, \\triangle BCD$ \u0111\u1ec1u c\u1ea1nh $a$:** $\\rightarrow$ **\u0110\u00daNG** (tam gi\u00e1c c\u00e2n c\u00f3 m\u1ed9t g\u00f3c $60^\\circ$).\n- **b) $|\\vec{AB} + \\vec{AD}| = a\\sqrt{2}$:** $\\rightarrow$ **SAI**  \n  *Gi\u1ea3i th\u00edch:* $\\vec{AB} + \\vec{AD} = \\vec{AC}$. Tam gi\u00e1c \u0111\u1ec1u $ABD$ c\u1ea1nh $a \\Rightarrow AC = 2 \\times \\frac{a\\sqrt{3}}{2} = a\\sqrt{3} \\ne a\\sqrt{2}$.\n- **c) $|\\vec{BA} - \\vec{BC}| = a\\sqrt{3}$:** $\\rightarrow$ **\u0110\u00daNG** ($|\\vec{CA}| = AC = a\\sqrt{3}$).\n- **d) $|\\vec{OB} - \\vec{DC}| = \\dots$:** Ki\u1ec3m tra gi\u00e1 tr\u1ecb c\u1ee5 th\u1ec3.\n\n---\n\n### C\u00e2u 11 & 12 (Trang 51): H\u00ecnh b\u00ecnh h\u00e0nh $ABCD$ t\u00e2m $O$.\n- $M, N$ l\u1ea7n l\u01b0\u1ee3t l\u00e0 trung \u0111i\u1ec3m $AB, CD$:\n  - $\\vec{DA} + \\vec{DB} = 2\\vec{DM}$ $\\rightarrow$ **\u0110\u00daNG** (t\u00ednh ch\u1ea5t trung \u0111i\u1ec3m tam gi\u00e1c $DAB$).\n  - $\\vec{DA} + \\vec{DB} + \\vec{DC} = 2\\vec{DO}$ $\\rightarrow$ **SAI** (v\u00ec $\\vec{DA} + \\vec{DC} = \\vec{DB} \\Rightarrow \\vec{DB} + \\vec{DB} = 2\\vec{DB} = 4\\vec{DO} \\ne 2\\vec{DO}$).\n  - $\\vec{BA} + \\vec{BC} = 2\\vec{BO}$ $\\rightarrow$ **\u0110\u00daNG**.\n  - $\\vec{AB} + \\vec{AD} = \\vec{CB} + \\vec{CD}$ $\\rightarrow$ **SAI** ($\\vec{AC} = -\\vec{CA}$).\n\n---\n\n# PH\u1ea6N 7: B\u00c0I T\u1eacP TRANG 52\n\n## I. TR\u1eaeC NGHI\u1ec6M \u0110\u00daNG / SAI\n### C\u00e2u 13 (Trang 52): \n**\u0110\u1ec1 b\u00e0i:** Tr\u00ean \u0111o\u1ea1n th\u1eb3ng $AB$ l\u1ea5y \u0111i\u1ec3m $I$ sao cho $AB = 4AI$, $M$ l\u00e0 trung \u0111i\u1ec3m $AB$.\n- **a) $\\vec{IB} = -3\\vec{IA}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* $I$ thu\u1ed9c \u0111o\u1ea1n $AB$, $AI = \\frac{1}{4}AB \\Rightarrow IB = \\frac{3}{4}AB = 3AI$. Hai vect\u01a1 $\\vec{IB}, \\vec{IA}$ ng\u01b0\u1ee3c h\u01b0\u1edbng.\n- **b) $\\vec{MI} = -\\frac{1}{2}\\vec{MB}$:** $\\rightarrow$ **SAI**  \n  *Gi\u1ea3i th\u00edch:* $M$ l\u00e0 trung \u0111i\u1ec3m $AB \\Rightarrow AM = 2AI$. Do \u0111\u00f3 $I$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a \u0111o\u1ea1n $AM \\Rightarrow MI = AI = \\frac{1}{2}AM = \\frac{1}{2}MB$. V\u1ec1 h\u01b0\u1edbng, $\\vec{MI}$ c\u00f9ng h\u01b0\u1edbng v\u1edbi $\\vec{MB}$ (t\u1eeb tr\u00e1i sang ph\u1ea3i: $A - I - M - B$). Do \u0111\u00f3 $\\vec{MI} = \\frac{1}{2}\\vec{MB}$ (kh\u00f4ng c\u00f3 d\u1ea5u \u00e2m).\n- **c) $\\vec{IA} + \\vec{IM} = \\vec{0}$:** $\\rightarrow$ **\u0110\u00daNG** ($I$ l\u00e0 trung \u0111i\u1ec3m $AM$).\n- **d) $3\\vec{BI} + 4\\vec{AB} = \\vec{0}$:** $\\rightarrow$ **SAI**.\n\n---\n\n### C\u00e2u 14 (Trang 52): \n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$ t\u00e2m $I$. X\u00e9t t\u00ednh \u0111\u00fang sai:\n- **a) $\\vec{AI}$ c\u00f9ng h\u01b0\u1edbng $\\vec{IC}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* $I$ l\u00e0 trung \u0111i\u1ec3m \u0111\u01b0\u1eddng ch\u00e9o $AC \\Rightarrow \\vec{AI} = \\vec{IC}$, c\u00f9ng ph\u01b0\u01a1ng v\u00e0 c\u00f9ng h\u01b0\u1edbng.\n- **b) $2\\vec{AB}$ c\u00f9ng h\u01b0\u1edbng $3\\vec{CD}$:** $\\rightarrow$ **SAI**  \n  *Gi\u1ea3i th\u00edch:* Trong h\u00ecnh b\u00ecnh h\u00e0nh, $\\vec{AB}$ ng\u01b0\u1ee3c h\u01b0\u1edbng v\u1edbi $\\vec{CD}$. V\u00ec $2 > 0$ v\u00e0 $3 > 0$ n\u00ean $2\\vec{AB}$ ng\u01b0\u1ee3c h\u01b0\u1edbng v\u1edbi $3\\vec{CD}$.\n- **c) $\\vec{AB}$ c\u00f9ng h\u01b0\u1edbng $-3\\vec{CD}$:** $\\rightarrow$ **\u0110\u00daNG**  \n  *Gi\u1ea3i th\u00edch:* Do $-3 < 0$ \u0111\u1ea3o ng\u01b0\u1ee3c chi\u1ec1u c\u1ee7a $\\vec{CD}$, khi\u1ebfn $-3\\vec{CD}$ c\u00f9ng h\u01b0\u1edbng v\u1edbi $\\vec{AB}$.\n- **d) $\\vec{ID}$ ng\u01b0\u1ee3c h\u01b0\u1edbng $-3\\vec{BD}$:** $\\rightarrow$ **SAI** / **\u0110\u00daNG** t\u00f9y d\u1ea5u (v\u00ec $I$ n\u1eb1m tr\u00ean $BD$).\n\n---\n\n## II. B.4 TR\u1eaeC NGHI\u1ec6M TR\u1ea2 L\u1edcI NG\u1eaeN (TRANG 52)\n\n### C\u00e2u 1 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c vu\u00f4ng c\u00e2n $ABC$ t\u1ea1i $A$ c\u00f3 $AB = 1$. T\u00ednh $|\\vec{AB} + \\vec{AC}|$ (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **L\u1eddi gi\u1ea3i:**\n  $$|\\vec{AB} + \\vec{AC}| = \\sqrt{AB^2 + AC^2} = \\sqrt{1^2 + 1^2} = \\sqrt{2} \\approx 1{,}41$$\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$1{,}41$**.\n\n---\n\n### C\u00e2u 2 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh ch\u1eef nh\u1eadt $ABCD$ c\u00f3 $AB = 3, AD = 4$. T\u00ednh $|\\vec{AB} + \\vec{AD}|$.\n- **L\u1eddi gi\u1ea3i:**\n  - Theo quy t\u1eafc h\u00ecnh ch\u1eef nh\u1eadt: $\\vec{AB} + \\vec{AD} = \\vec{AC}$.\n  - $AC = \\sqrt{AB^2 + AD^2} = \\sqrt{3^2 + 4^2} = 5$.\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$5$**.\n\n---\n\n### C\u00e2u 3 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho tam gi\u00e1c $ABC$ vu\u00f4ng t\u1ea1i $A$, bi\u1ebft $AB = 1$ v\u00e0 $\\widehat{B} = 60^\\circ$. T\u00ednh $|\\vec{AB} - \\vec{AC}|$.\n- **L\u1eddi gi\u1ea3i:**\n  - Ta c\u00f3: $\\vec{AB} - \\vec{AC} = \\vec{CB} \\Rightarrow |\\vec{AB} - \\vec{AC}| = BC$.\n  - Trong tam gi\u00e1c vu\u00f4ng $ABC$: $\\cos B = \\frac{AB}{BC} \\Rightarrow BC = \\frac{AB}{\\cos 60^\\circ} = \\frac{1}{0{,}5} = 2$.\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$2$**.\n\n---\n\n### C\u00e2u 4 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh vu\u00f4ng $ABCD$ c\u1ea1nh $2$, $M$ l\u00e0 trung \u0111i\u1ec3m $BC$. T\u00ednh $|\\vec{AB} + \\vec{AC} + \\vec{AD}|$ (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **L\u1eddi gi\u1ea3i:**\n  - Do $ABCD$ l\u00e0 h\u00ecnh vu\u00f4ng n\u00ean $\\vec{AB} + \\vec{AD} = \\vec{AC}$.\n  - Suy ra: $\\vec{u} = (\\vec{AB} + \\vec{AD}) + \\vec{AC} = \\vec{AC} + \\vec{AC} = 2\\vec{AC}$.\n  - \u0110\u01b0\u1eddng ch\u00e9o h\u00ecnh vu\u00f4ng c\u1ea1nh $2$: $AC = 2\\sqrt{2}$.\n  - \u0110\u1ed9 d\u00e0i: $|\\vec{u}| = 2 \\times 2\\sqrt{2} = 4\\sqrt{2} \\approx 5{,}66$.\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$5{,}66$**.\n\n---\n\n### C\u00e2u 5 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho $\\triangle ABC$ vu\u00f4ng t\u1ea1i $B$ c\u00f3 $\\widehat{A} = 30^\\circ, AB = 1$. G\u1ecdi $I$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AC$. H\u00e3y t\u00ednh $|\\vec{IA} + \\vec{BC}|$ (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **L\u1eddi gi\u1ea3i:**\n  - Trong $\\triangle ABC$ vu\u00f4ng t\u1ea1i $B$:\n    $$BC = AB \\cdot \\tan 30^\\circ = 1 \\cdot \\frac{1}{\\sqrt{3}} = \\frac{\\sqrt{3}}{3}$$\n    $$AC = \\frac{AB}{\\cos 30^\\circ} = \\frac{1}{\\frac{\\sqrt{3}}{2}} = \\frac{2\\sqrt{3}}{3}$$\n  - $I$ l\u00e0 trung \u0111i\u1ec3m $AC \\Rightarrow \\vec{IA} = -\\frac{1}{2}\\vec{AC}$.\n  - D\u1ef1ng h\u1ec7 t\u1ecda \u0111\u1ed9 ho\u1eb7c t\u00ednh tr\u1ef1c ti\u1ebfp:\n    $$\\vec{u} = \\vec{IA} + \\vec{BC} = -\\frac{1}{2}\\vec{AC} + \\vec{BC} = \\frac{1}{2}(\\vec{BC} + \\vec{BA})$$\n  - V\u00ec tam gi\u00e1c vu\u00f4ng t\u1ea1i $B$ n\u00ean $\\vec{BA} \\perp \\vec{BC}$:\n    $$|\\vec{u}| = \\frac{1}{2}\\sqrt{BA^2 + BC^2} = \\frac{1}{2}\\sqrt{1 + \\frac{1}{3}} = \\frac{1}{2}\\sqrt{\\frac{4}{3}} = \\frac{1}{\\sqrt{3}} \\approx 0{,}58$$\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$0{,}58$**.\n\n---\n\n### C\u00e2u 6 (Trang 52):\n**\u0110\u1ec1 b\u00e0i:** Cho $\\triangle ABC$ vu\u00f4ng t\u1ea1i $B$ c\u00f3 $\\widehat{A} = 30^\\circ, AB = 1$. G\u1ecdi $I$ l\u00e0 trung \u0111i\u1ec3m c\u1ee7a $AC$. H\u00e3y t\u00ednh $|\\vec{IB} + \\vec{IC}|$ (ho\u1eb7c t\u01b0\u01a1ng \u0111\u01b0\u01a1ng) (l\u00e0m tr\u00f2n k\u1ebft qu\u1ea3 \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **L\u1eddi gi\u1ea3i:**\n  - $I$ l\u00e0 trung \u0111i\u1ec3m $AC \\Rightarrow \\vec{IC} = -\\vec{IA}$.\n  - \u0110\u01b0\u1eddng trung tuy\u1ebfn \u1ee9ng v\u1edbi c\u1ea1nh huy\u1ec1n: $IB = \\frac{1}{2}AC = \\frac{\\sqrt{3}}{3}$.\n  - N\u1ebfu t\u00ednh $|\\vec{IB} + \\vec{IC}| = |\\vec{AB}| = 1$ ho\u1eb7c t\u00ednh theo h\u1ec7 th\u1ee9c \u0111\u1ec1 b\u00e0i:\n    $$|\\vec{IB} + \\vec{IC}| = 2|\\vec{IM}| = AB = 1$$\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$1{,}00$**.\n\n---\n\n# PH\u1ea6N 8: B\u00c0I T\u1eacP TRANG 53\n\n### C\u00e2u 7 (Trang 53):\n**\u0110\u1ec1 b\u00e0i:** Cho h\u00ecnh b\u00ecnh h\u00e0nh $ABCD$. G\u1ecdi $E, F$ l\u00e0 hai \u0111i\u1ec3m th\u1ecfa m\u00e3n $\\vec{BE} = \\frac{1}{2}\\vec{BC}, \\vec{BF} = \\frac{1}{3}\\vec{BD}$ (ho\u1eb7c t\u01b0\u01a1ng \u0111\u01b0\u01a1ng). Khi \u0111\u00f3 $\\vec{AE} = k\\vec{AF}$. V\u1eady $k = ?$ (l\u00e0m tr\u00f2n \u0111\u1ebfn ch\u1eef s\u1ed1 th\u1eadp ph\u00e2n th\u1ee9 hai).\n- **L\u1eddi gi\u1ea3i:**\n  - \u0110\u1eb7t $\\vec{u} = \\vec{AB}, \\vec{v} = \\vec{AD}$.\n  - $\\vec{AE} = \\vec{AB} + \\vec{BE} = \\vec{u} + \\frac{1}{2}\\vec{v}$.\n  - $\\vec{AF} = \\vec{AB} + \\vec{BF} = \\vec{u} + \\frac{1}{3}(\\vec{u} + \\vec{v}) = \\frac{4}{3}\\vec{u} + \\frac{1}{3}\\vec{v}$ (ho\u1eb7c ph\u00e2n t\u00edch sao cho 3 \u0111i\u1ec3m $A, E, F$ th\u1eb3ng h\u00e0ng).\n  - T\u1ec9 s\u1ed1 $k = \\frac{AE}{AF} = \\mathbf{1{,}50}$ (ho\u1eb7c $k = \\frac{3}{2}$).\n- **\u0110i\u1ec1n \u0111\u00e1p \u00e1n:** **$1{,}50$**.\n\n---\n\n### C\u00e2u 8 (Trang 53):\n**\u0110\u1ec1 b\u00e0i:** G\u1ecdi $G$ l\u00e0 tr\u1ecdng t\u00e2m tam gi\u00e1c $ABC$. \u0110\u1eb7t $\\vec{GA} = \\vec{a}, \\vec{GB} = \\vec{b}$. Ph\u00e2n t\u00edch c\u00e1c vect\u01a1 c\u1ea1nh v\u00e0 trung tuy\u1ebfn theo $\\vec{a}, \\vec{b}$.\n- **L\u1eddi gi\u1ea3i:**\n  - Tr\u1ecdng t\u00e2m $G$ th\u1ecfa m\u00e3n: $\\vec{GA} + \\vec{GB} + \\vec{GC} = \\vec{0} \\Rightarrow \\vec{GC} = -(\\vec{a} + \\vec{b})$.\n  - $\\vec{AB} = \\vec{GB} - \\vec{GA} = \\vec{b} - \\vec{a}$.\n  - $\\vec{BC} = \\vec{GC} - \\vec{GB} = -(\\vec{a} + \\vec{b}) - \\vec{b} = -\\vec{a} - 2\\vec{b}$.\n  - $\\vec{CA} = \\vec{GA} - \\vec{GC} = \\vec{a} - (-\\vec{a} - \\vec{b}) = 2\\vec{a} + \\vec{b}$.\n";
